<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TEK-TREND">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1C2430">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Rendement Atelier - TEK-TREND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#EEF2F6;
    --ink:#111827; --ink-soft:#5B6472; --ink-faint:#94A0AD;
    --accent:#0F3D66; --accent-2:#1a5c99; --accent-bg:#E9F1F9;
    /* 4 paliers de rendement (validés) : critique / insuffisant / bon / atteint-dépassé */
    --crit:#D64545; --crit-bg:#FCEAEA;
    --warn:#D9822B; --warn-bg:#FDF1E3;
    --good:#1F8F5F; --good-bg:#E7F5EE;
    --excellent:#B8860B; --excellent-bg:#FBF1D9;
    --bad:#D64545; --bad-bg:#FCEAEA; /* alias de compatibilité (= --crit) */
    --border:#E4E8ED; --border-soft:#EDF0F3; --radius:14px; --radius-sm:9px;
    --sans:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03);
    --shadow-md:0 4px 16px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.05);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  input,select,button{font-family:inherit;font-size:15px;}
  #app{display:flex;flex-direction:column;min-height:100dvh;}
  h2,h3{letter-spacing:-.01em;}
  
  /* --- LOGO CSS TEK-TREND --- */
  .logo-wrap { display:flex; flex-direction:column; align-items:center; line-height:1; }
  .logo-tt { font-size:28px; font-weight:800; letter-spacing:-2px; margin-bottom:2px; }
  .logo-text { font-size:22px; font-weight:900; letter-spacing:1px; }
  .logo-sub { font-size:10px; color:var(--ink-soft); font-weight:500; letter-spacing:1.5px; margin-top:3px; }
  .t-blue, .tek { color:var(--accent); }
  .t-black, .trend { color:#111; }
  
  .topbar .logo-wrap { align-items:flex-start; }
  .topbar .logo-tt { display:none; } /* Masqué dans la barre du haut pour gagner de la place */
  .topbar .logo-text { font-size:18px; }
  .topbar .logo-sub { font-size:8px; }

  /* --- LOGIN --- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#F3F5F8 0%,#E8EDF3 100%);}
  .login-card{background:var(--surface);border-radius:20px;padding:36px 30px;width:100%;max-width:380px;box-shadow:var(--shadow-md);border:1px solid var(--border-soft);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .field input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--ink);transition:border-color .15s var(--ease),background .15s var(--ease);}
  .field input:focus{outline:none;border-color:var(--accent-2);background:#fff;box-shadow:0 0 0 3px var(--accent-bg);}
  .pw-field{position:relative;}
  .pw-toggle{position:absolute;right:6px;top:6px;bottom:6px;background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:0 10px;display:flex;align-items:center;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14.5px;cursor:pointer;transition:transform .1s var(--ease),box-shadow .15s var(--ease),background .15s var(--ease);}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(15,61,102,.25);}
  .btn-primary:hover{background:var(--accent-2);}
  .btn-ghost{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--border);}
  .btn-success{background:var(--good);color:#fff;}
  .btn-warning{background:var(--warn);color:#fff;}
  .btn-block{width:100%;margin-top:6px;}
  .login-error{background:var(--bad-bg);color:var(--bad);padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px;display:none; text-align:center; font-weight:700;}
  
  /* --- SHELL --- */
  .topbar{background:linear-gradient(120deg,#001f3f 0%,#0a2f52 100%); color:#fff; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20; box-shadow:var(--shadow-sm); flex-wrap:wrap; row-gap:6px; gap:8px;}
  .topbar .logo-text{position:relative;}
  .topbar .tek{color:#5EB3FF;position:relative;}
  .topbar .tek::after{content:'';position:absolute;left:1px;bottom:-5px;width:22px;height:8px;border-bottom:3px solid #FFC833;border-radius:50%;transform:rotate(-8deg);}
  .topbar .trend{color:#fff;}
  .topbar .logo-sub{color:rgba(255,255,255,.55);}
  .user-chip{display:flex;align-items:center;gap:6px;font-size:12.5px;flex-shrink:0;}
  .sync-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
  .sync-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
  .sync-badge svg{width:11px;height:11px;flex-shrink:0;}
  .sync-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .sync-badge.sync-off{background:var(--bad-bg);color:var(--bad);}
  .sync-badge.sync-connecting{background:var(--warn-bg);color:var(--warn);}
  .sync-badge.sync-connecting::before{animation:pulse 1s infinite;}
  .sync-badge.sync-ok{background:var(--good-bg);color:var(--good);}
  .sync-badge.sync-error{background:var(--bad-bg);color:var(--bad);}
  .sync-time{font-size:9px;color:rgba(255,255,255,.5);font-weight:600;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .user-chip .role{background:rgba(255,255,255,.14); color:#fff; padding:4px 8px; border-radius:20px; font-size:10.5px; font-weight:700;white-space:nowrap;}
  .user-chip .uname{font-weight:700;font-size:12.5px;white-space:nowrap;color:#fff;}
  .user-avatar-ic{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .user-chevron{color:rgba(255,255,255,.6);display:flex;align-items:center;flex-shrink:0;}
  .user-chip button{background:rgba(255,255,255,.14);border:none;color:#fff;cursor:pointer;padding:7px;border-radius:9px;display:flex;transition:background .15s,color .15s;flex-shrink:0;}
  .user-chip button:hover{background:var(--bad-bg);color:var(--bad);}
  .user-chip button svg{width:16px;height:16px;}
  .sync-time{display:none;}
  .user-chip .role{display:none;}
  .topbar .logo-sub{display:none;}
  .sync-badge span{display:none;}
  .user-avatar-ic{width:22px;height:22px;}
  .user-chip{gap:4px;}
  .topbar{padding:8px 10px;flex-wrap:nowrap;}
  .topbar .logo-text{font-size:16px;}
  .user-chip .uname{font-size:11px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .app-body{flex:1;display:flex;flex-direction:column;min-width:0;}
  main{flex:1;display:flex;flex-direction:column;padding:6px 5px 56px; max-width: 900px; margin: 0 auto; width: 100%;}
  .anchor-bottom{margin-top:auto;}

  .sidebar{display:none;flex-direction:column;width:220px;background:#fff;border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;padding:20px 0;z-index:25;}
  .sidebar .side-logo{padding:0 20px 22px;}
  .sidebar nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
  .sidebar nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border:none;background:none;border-radius:10px;color:var(--ink-soft);font-weight:600;font-size:13.5px;cursor:pointer;text-align:left;transition:background .15s,color .15s;}
  .sidebar nav button svg{width:19px;height:19px;flex-shrink:0;}
  .sidebar nav button:hover{background:var(--surface-2);color:var(--ink);}
  .sidebar nav button.active{background:var(--accent-bg);color:var(--accent);}
  .sidebar .side-sep{height:1px;background:var(--border);margin:10px 20px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;margin-bottom:8px;overflow-x:auto; box-shadow:var(--shadow-sm); animation:fadein .25s var(--ease);}
  .card h2{font-size:15.5px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em;}
  .card h3{font-weight:700;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  
  /* --- NAVIGATION --- */
  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:30;box-shadow:0 -2px 12px rgba(15,23,42,.04);padding-bottom:env(safe-area-inset-bottom);}
  .bottomnav button{flex:1;background:none;border:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-faint);cursor:pointer;transition:color .15s var(--ease);position:relative;min-height:52px;justify-content:center;}
  .bottomnav button.active{color:var(--accent);}
  .bottomnav button.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);}
  .bottomnav svg{width:20px;height:20px;}
  .nav-icon-wrap{position:relative;display:inline-flex;}
  .nav-badge{position:absolute;top:-3px;right:-5px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--surface);animation:navBadgePulse 1.3s infinite;}
  @keyframes navBadgePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(1.35);}}

  /* --- Barre de progression animée (réel vs objectif) avec repère de rythme --- */
  .pace-track{position:relative;height:16px;border-radius:20px;background:var(--surface-3);margin:22px 2px 6px;overflow:visible;}
  .pace-fill{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:20px;transition:width 1s cubic-bezier(.22,1,.36,1);}
  .pace-fill.bad{background:var(--bad);} .pace-fill.warn{background:var(--warn);} .pace-fill.good{background:var(--good);} .pace-fill.excellent{background:var(--excellent);}
  .pace-marker{position:absolute;top:-5px;width:3px;height:26px;background:var(--ink);border-radius:2px;transform:translateX(-50%);opacity:0;transition:left 1s cubic-bezier(.22,1,.36,1), opacity .3s .6s;}
  .pace-marker .pm-label{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--ink-soft);white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;}
  .pace-legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-faint);margin-top:4px;font-weight:600;}
  .pulse-attn{animation:pulseAttn 1.4s ease-in-out infinite;}
  @keyframes pulseAttn{0%,100%{opacity:1;}50%{opacity:.55;}}

  /* --- Carte héro du Tableau de bord --- */
  .hero-card{position:relative;overflow:hidden;border-radius:13px;background:linear-gradient(100deg,rgba(15,61,102,.97) 0%,rgba(15,61,102,.75) 45%,rgba(15,61,102,.35) 100%),url('./hero-bg.jpg');background-size:cover;background-position:right center;color:#fff;padding:9px 10px 9px;margin-bottom:6px;box-shadow:var(--shadow-md);}
  .hero-illus{position:absolute;right:-30px;top:-10px;height:115%;width:62%;color:rgba(255,255,255,.09);pointer-events:none;}
  .page-date-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
  .hero-date{display:flex;align-items:center;gap:10px;}
  .hero-date-icon{width:26px;height:26px;border-radius:8px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hero-date-icon svg{width:19px;height:19px;}
  .hero-date h2{margin:0;font-size:14px;font-weight:800;color:var(--ink);}
  .hero-date .hd-sub{font-size:12px;color:var(--ink-soft);text-transform:capitalize;}
  .hero-obj-badge{border-radius:9px;padding:4px 8px;display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;flex-shrink:0;}
  .hero-obj-badge.bad{background:var(--bad-bg);color:var(--bad);}
  .hero-obj-badge.warn{background:var(--warn-bg);color:var(--warn);}
  .hero-obj-badge.good{background:var(--good-bg);color:var(--good);}
  .hero-obj-badge.excellent{background:var(--excellent-bg);color:var(--excellent);}
  .hero-obj-badge svg{width:18px;height:18px;color:currentColor;flex-shrink:0;}
  .hero-obj-badge .hob-sub{font-weight:500;color:currentColor;opacity:.75;font-size:10.5px;}
  .hero-main{display:flex;align-items:center;gap:12px;margin-top:3px;position:relative;z-index:1;flex-wrap:wrap;}
  .hero-info{display:flex;flex-direction:column;gap:5px;min-width:130px;}
  .hero-info-row{display:flex;align-items:center;gap:9px;}
  .hero-info-icon{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hero-info-icon svg{width:14px;height:14px;}
  .hero-stat-big{font-size:21px;font-weight:800;line-height:1;}
  .hero-stat-lbl{font-size:11.5px;color:rgba(255,255,255,.65);font-weight:600;}
  .hero-obj-line{font-size:13px;color:rgba(255,255,255,.85);font-weight:600;}
  .hero-ahead-pill{display:inline-flex;align-items:stretch;border-radius:20px;overflow:hidden;font-size:12.5px;font-weight:800;margin-top:2px;}
  .hero-ahead-pill .hap-num{background:var(--excellent);color:#fff;padding:6px 12px;display:flex;align-items:center;}
  .hero-ahead-pill .hap-txt{background:var(--excellent-bg);color:var(--excellent);padding:6px 12px 6px 10px;display:flex;align-items:center;gap:6px;}
  .hero-ahead-pill.behind .hap-num{background:#D64545;}
  .hero-ahead-pill.behind .hap-txt{background:rgba(214,69,69,.18);color:#FF9B92;}
  .hero-divider{width:1px;align-self:stretch;background:rgba(255,255,255,.25);flex-shrink:0;margin:0 2px;}
  .hero-tagline{position:relative;z-index:1;text-align:right;font-family:'Caveat',cursive;font-weight:700;font-style:italic;font-size:14px;color:rgba(255,255,255,.6);margin-top:3px;transform:rotate(-2deg);}
  .hero-track-wrap{position:relative;z-index:1;margin-top:8px;}
  .hero-track{position:relative;height:14px;border-radius:20px;background:rgba(255,255,255,.14);overflow:visible;}
  .hero-track-fill{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:20px;transition:width 1.1s cubic-bezier(.22,1,.36,1);background:linear-gradient(90deg,#E0A519,#FFC72C);}
  .hero-track-fill.bad{background:linear-gradient(90deg,#c4453f,var(--bad));}
  .hero-track-fill.warn{background:linear-gradient(90deg,#c4881f,var(--warn));}
  .hero-track-fill.good{background:linear-gradient(90deg,#1a7a51,var(--good));}
  .hero-track-legend{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.55);margin-top:6px;font-weight:600;}
  .hero-track-legend b{color:#fff;font-family:var(--mono);}

  /* --- Cartes KPI avec badge icône coloré --- */
  .kpi-ic{display:flex;flex-direction:column;gap:10px;}
  .kpi-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}
  .kpi-mini{border:1px solid var(--border);border-radius:11px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;}
  .kpi-mini.tint-blue{background:linear-gradient(180deg,var(--accent-bg) 0%,var(--surface) 65%);}
  .kpi-mini.tint-green{background:linear-gradient(180deg,var(--good-bg) 0%,var(--surface) 65%);}
  .kpi-mini.tint-red{background:linear-gradient(180deg,var(--bad-bg) 0%,var(--surface) 65%);}
  .kpi-mini.tint-gold{background:linear-gradient(180deg,var(--excellent-bg) 0%,var(--surface) 65%);}
  .kpi-mini-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:2px;box-shadow:0 2px 6px rgba(15,23,42,.14);}
  .kpi-mini-icon svg{width:13px;height:13px;color:#fff;}
  .kpi-mini-val{font-family:var(--mono);font-weight:800;font-size:14px;line-height:1;}
  .kpi-mini-lbl{font-size:8.5px;color:var(--ink-soft);font-weight:700;line-height:1.15;}
  .kpi-mini-sub{font-size:7.5px;font-weight:800;padding:1px 5px;border-radius:8px;margin-top:1px;}
  .kpi-ic-badge{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 5px 12px rgba(15,23,42,.16);}
  .kpi-ic-badge svg{width:25px;height:25px;color:#fff;stroke-width:2.2;}
  .kpi-ic-badge.blue{background:linear-gradient(145deg,#4A9EFF,#0F62D6);}
  .kpi-ic-badge.green{background:linear-gradient(145deg,#34D18C,#0E8F52);}
  .kpi-ic-badge.red{background:linear-gradient(145deg,#FF6B6B,#DC2E2E);}
  .kpi-ic-badge.gold{background:linear-gradient(145deg,#FFCB4D,#D9930C);}
  .kpi-ic-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .kpi-ic-value{font-family:var(--mono);font-size:22px;font-weight:800;}
  .kpi-ic-value.bad{color:var(--bad);} .kpi-ic-value.warn{color:var(--warn);} .kpi-ic-value.good{color:var(--good);} .kpi-ic-value.excellent{color:var(--excellent);}
  .kpi-ic-mini-bar{height:6px;border-radius:20px;background:var(--surface-3);overflow:hidden;margin-top:2px;}
  .kpi-ic-mini-bar > div{height:100%;border-radius:20px;transition:width .8s var(--ease);}
  .kpi-ic-sub{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;width:fit-content;}
  .kpi-ic-sub.green{background:var(--good-bg);color:var(--good);}

  /* --- Classement médaillé des opératrices --- */
  .rank-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .12s;}
  .rank-row:last-child{border-bottom:none;}
  .rank-row:active{background:var(--surface-2);}
  .rank-medal{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .rank-medal.m1{background:#FCEFC7;color:#A8790A;}
  .rank-medal.m2{background:#E8ECF0;color:#5B6472;}
  .rank-medal.m3{background:#F5DCC3;color:#9A5A22;}
  .rank-medal.m4{background:var(--surface-3);color:var(--ink-faint);}
  .rank-body{flex:1;min-width:0;}
  .rank-name{font-weight:700;font-size:13.5px;margin-bottom:4px;}
  .rank-bar{height:8px;border-radius:20px;background:var(--surface-3);overflow:hidden;}
  .rank-bar > div{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .8s var(--ease);}
  .rank-nums{text-align:right;flex-shrink:0;min-width:64px;}
  .rank-nums .rn-val{font-family:var(--mono);font-weight:800;font-size:14px;}
  .rank-nums .rn-pct{font-size:10.5px;color:var(--ink-faint);}
  .rank-chevron{color:var(--ink-faint);flex-shrink:0;}

  /* --- Bandeau résumé bas de page --- */
  .summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .summary-item{display:flex;flex-direction:row;align-items:center;text-align:left;gap:6px;padding:6px 6px;border-right:1px solid var(--border-soft);min-width:0;overflow:hidden;}
  .summary-item:last-child{border-right:none;}
  .summary-item .si-icon{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .summary-item .si-icon svg{width:11px;height:11px;}
  .summary-item .si-lbl{font-size:8px;color:var(--ink-soft);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .summary-item .si-val{font-family:var(--mono);font-weight:800;font-size:11px;white-space:nowrap;}

  /* --- Modale de détail opératrice --- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fadein .15s;}
  .modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:82vh;overflow-y:auto;padding:22px 20px calc(20px + env(safe-area-inset-bottom));animation:sheetUp .25s cubic-bezier(.22,1,.36,1);}
  @keyframes sheetUp{from{transform:translateY(30px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
  @media (min-width:760px){ .modal-backdrop{align-items:center;} .modal-sheet{border-radius:18px;max-height:85vh;} }
  .bottomnav span{font-size:10px;font-weight:700;}
  
  /* --- KPIS & TABLES --- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:10px;margin-bottom:14px;}
  .kpi{background:var(--surface);border-radius:var(--radius-sm);padding:14px 15px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .kpi .label{font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em;}
  .kpi .value{font-family:var(--mono);font-size:24px;font-weight:800;letter-spacing:-.01em;}
  .kpi .value.good{color:var(--good);} .kpi .value.warn{color:var(--warn);} .kpi .value.bad{color:var(--bad);} .kpi .value.excellent{color:var(--excellent);}
  .hour-rend{font-size:10px;font-weight:800;margin-top:2px;}
  .hour-rend.good{color:var(--good);} .hour-rend.warn{color:var(--warn);} .hour-rend.bad{color:var(--bad);} .hour-rend.excellent{color:var(--excellent);}
  .session-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
  .session-row:last-child{border-bottom:none;}
  
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;background:var(--surface-2);color:var(--ink-soft);padding:11px 7px;border-bottom:2px solid var(--border);font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  td{padding:7px 5px;border-bottom:1px solid var(--border-soft);white-space:nowrap;vertical-align:middle;}
  tbody tr{transition:background .1s;}
  
  /* Inputs Saisie */
  .input-cell input{width:100%;min-width:58px;padding:10px 4px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--mono);text-align:center;font-weight:700;color:var(--ink);font-size:14.5px;background:#fff;transition:border-color .15s,box-shadow .15s;}
  .input-cell input:focus{outline:none;border-color:var(--accent-2);background:#fff;box-shadow:0 0 0 3px var(--accent-bg);}
  .input-cell input:disabled{background:var(--surface-2);color:var(--ink-soft);border-color:transparent;}
  .obs-cell input{width:100%;min-width:110px;text-align:left;}
  
  /* Affichage Historique (Sans input) */
  .hist-cell { text-align:center; font-family:var(--mono); font-weight:700; font-size:14px; }
  .hist-obs { font-size:12px; color:var(--ink-soft); white-space:normal; min-width:120px; }
  
  .total-col{font-weight:bold;font-family:var(--mono);background:var(--surface-2);text-align:center;color:var(--ink);}
  .total-row{font-weight:bold;background:var(--surface-2);}
  .cumul-col{font-weight:bold;font-family:var(--mono);background:var(--good-bg);color:var(--good);text-align:center;}
  
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastin .2s var(--ease);}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
  .flex-header{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;}
  .flex-header .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .flex-header input[type="date"]{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:var(--sans); font-weight:600;}
  
  .badge{padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;}
  .badge.orange{background:var(--warn-bg);color:var(--warn);}
  .badge.green{background:var(--good-bg);color:var(--good);}
  .badge.red{background:var(--bad-bg);color:var(--bad);}
  
  /* --- GRAPHIQUES NATIFS --- */
  .native-chart { display: flex; align-items: flex-end; justify-content: space-around; height: 180px; padding: 20px 5px 0; border-bottom: 2px solid var(--border); margin-top: 15px; gap: 4px; }
  .nc-col { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
  .nc-val { font-size: 11px; font-weight: 800; color: var(--ink); margin-bottom: 4px; font-family: var(--mono); }
  .nc-bar { width: 100%; max-width: 36px; background: var(--accent); border-radius: 6px 6px 0 0; transition: height .5s var(--ease); min-height: 3px; }
  .nc-lbl { margin-top: 7px; font-size: 10px; color: var(--ink-soft); font-weight: 700; text-align: center; line-height: 1.15; word-wrap: break-word; }
  .nc-bar.green { background: var(--good); }
  .nc-bar.blue { background: var(--accent); }
  .nc-col.best .nc-val{color:var(--good);} .nc-col.best .nc-bar{background:var(--good);}
  .nc-col.worst .nc-lbl{color:var(--bad);}

  /* --- JAUGE DE RENDEMENT (anneau SVG) --- */
  .gauge-wrap{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;padding:6px 0;}
  .gauge-ring{position:relative;width:150px;height:150px;flex-shrink:0;}
  .gauge-ring svg{transform:rotate(-90deg);}
  .gauge-ring .track{fill:none;stroke:var(--surface-3);stroke-width:14;}
  .gauge-ring .prog{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease),stroke .3s;}
  .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge-pct{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1;}
  .gauge-lbl{font-size:10px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}
  .gauge-side{display:flex;flex-direction:column;gap:8px;min-width:130px;}
  .gauge-stat{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;}
  .gauge-stat b{font-family:var(--mono);font-weight:800;}
  .gauge-status{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:20px;display:inline-block;width:fit-content;}
  .gauge-status.bad{background:var(--bad-bg);color:var(--bad);}
  .gauge-status.warn{background:var(--warn-bg);color:var(--warn);}
  .gauge-status.good{background:var(--good-bg);color:var(--good);}
  .gauge-status.excellent{background:var(--excellent-bg);color:var(--excellent);}
  .gauge-status.off{background:var(--surface-3);color:var(--ink-faint);}

  /* Mini-jauge (barre) pour Saisie/Historique */
  .mini-gauge{width:100%;height:7px;border-radius:20px;background:var(--surface-3);overflow:hidden;margin-top:6px;}
  .mini-gauge > div{height:100%;border-radius:20px;transition:width .5s var(--ease);}
  .mini-gauge .bad{background:var(--bad);} .mini-gauge .warn{background:var(--warn);} .mini-gauge .good{background:var(--good);} .mini-gauge .excellent{background:var(--excellent);}

  /* --- ALERTES --- */
  .alert{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;margin-bottom:14px;border:1px solid transparent;}
  .alert svg{width:18px;height:18px;flex-shrink:0;}
  .alert.bad{background:var(--bad-bg);color:var(--bad);border-color:rgba(214,69,69,.2);}
  .alert.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(217,130,43,.2);}
  .alert.good{background:var(--good-bg);color:var(--good);border-color:rgba(31,143,95,.2);}
  .alert.excellent{background:var(--excellent-bg);color:var(--excellent);border-color:rgba(15,61,102,.2);}

  /* --- ÉTATS VIDES --- */
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 16px;color:var(--ink-faint);}
  .empty-state svg{width:40px;height:40px;margin-bottom:10px;opacity:.5;}
  .empty-state .es-title{font-size:13.5px;font-weight:700;color:var(--ink-soft);margin-bottom:3px;}
  .empty-state .es-sub{font-size:12px;}

  /* --- LOADER --- */
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
  .spinner.dark{border:2px solid var(--border);border-top-color:var(--accent);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px;}
  @keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
  
  @media print{ .bottomnav, .topbar, .no-print, .btn{display:none !important;} body{background:#fff;} main{padding:0;} .card{border:none;box-shadow:none;} th{color:#000 !important; background:#eee !important; border-bottom:1px solid #000;} td{border-bottom:1px solid #ccc;}}

  /* --- DESKTOP (≥1024px) : sidebar + mise en page large ---       */
  /* Placé en fin de feuille de style pour l'emporter sur les       */
  /* règles de base (.sidebar, .bottomnav) à spécificité CSS égale. */
  @media (min-width:1024px){
    #app{flex-direction:row;}
    .topbar{position:fixed;top:0;left:220px;right:0;z-index:15;}
    .sidebar{display:flex;}
    .bottomnav{display:none;}
    .app-body{margin-left:220px;width:calc(100% - 220px);display:flex;flex-direction:column;min-height:100vh;}
    main{max-width:1180px;padding:88px 32px 40px;}
    .kpi-grid{grid-template-columns:repeat(4, 1fr);}
    .gauge-wrap{justify-content:flex-start;gap:40px;}
    .topbar .logo-wrap{display:none;}
    .topbar{justify-content:flex-end;}
  }
  @media (min-width:1024px) and (max-width:1279px){
    main{max-width:960px;}
  }

const AUTH_EMAIL_DOMAIN = 'tek-trend.app';
function emailForUsername(u){ return u.toLowerCase().trim() + '@' + AUTH_EMAIL_DOMAIN; }

// admin       : accès complet (saisie + historique + stats + paramètres + comptes)

// viewer      : consultation uniquement (Tableau, Historique, Stats)
function canSaisie(role){ return role === 'admin' || role === 'chef_chaine'; }

function getLocalUsers(){
  try { const v = window.localStorage.getItem(CACHE_PREFIX+'local_users'); if(v) return JSON.parse(v); } catch(e) {}

let fbAuth = null;
function initFirebase(){
  if(!firebaseConfigured()){
    console.warn('Firebase non configuré : mode local uniquement (pas de partage entre appareils).');
    setSyncBadge('off');
    return;
  }
  if(typeof firebase === 'undefined'){
    console.error('SDK Firebase indisponible (pas de connexion internet au premier chargement ?).');
    setSyncBadge('error');
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbRootRef = firebase.database().ref(FIREBASE_PATH);
    firebaseReady = true;
    // IMPORTANT : depuis le Lot D (sécurité), les règles Firebase exigent d'être
    // authentifié pour lire/écrire. On ne s'abonne donc aux données qu'après une
    // connexion réussie (voir attachFirebaseDataListeners), pas ici.
    setSyncBadge('off');
  }catch(err){
    console.error('Erreur initialisation Firebase :', err);
    setSyncBadge('error');
  }
}
function attachFirebaseDataListeners(){
  if(!firebaseReady || !fbRootRef) return;
  setSyncBadge('connecting');
  fbRootRef.on('value', function(snap){
    const data = snap.val() || {};
    Object.keys(data).forEach(function(k){ memoryCache[CACHE_PREFIX+k] = data[k]; });
    setSyncBadge('ok');
    if(!currentUser) return;
    checkForNewMessages(data);
    updateNavBadges();

    else { nav(activeTab); }
  }, function(err){
    console.error('Erreur Firebase (lecture) :', err);

}
function detachFirebaseDataListeners(){
  if(fbRootRef){ fbRootRef.off(); fbRootRef.child('sessions').off(); }

function syncToFirebase(key, value){
  if(!firebaseReady || !fbRootRef) return;
  fbRootRef.child(key).set(value).then(function(){
    setSyncBadge('ok');
  }).catch(function(err){
    console.error('Erreur de synchronisation Firebase :', err);
    setSyncBadge('error');
    showToast("⚠️ Non synchronisé (vérifiez la connexion)");

let sessionsCache = {};
function genId(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function shortDevice(){
  const ua = navigator.userAgent || '';
  if(/Android/i.test(ua)) return 'Téléphone Android';
  if(/iPhone|iPad/i.test(ua)) return 'iPhone / iPad';
  if(/Windows/i.test(ua)) return 'PC Windows';
  if(/Macintosh/i.test(ua)) return 'Mac';
  return 'Appareil';
}
function timeAgo(ts){
  if(!ts) return '—';
  const diff = Math.max(0, Date.now() - ts);
  const mins = Math.floor(diff/60000);
  if(mins < 1) return "à l'instant";
  if(mins < 60) return `il y a ${mins} min`;
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return `il y a ${hrs} h`;
  return `il y a ${Math.floor(hrs/24)} j`;
}
// Une session sans battement depuis plus de 30 minutes est considérée comme
// abandonnée (app fermée sans déconnexion propre) et supprimée automatiquement.
const SESSION_STALE_MS = 30 * 60 * 1000;
function cleanupStaleSessions(){
  if(!firebaseReady || !fbRootRef) return;
  const now = Date.now();
  Object.entries(sessionsCache).forEach(([sid, s]) => {
    if(sid !== mySessionId && s && s.lastSeen && (now - s.lastSeen) > SESSION_STALE_MS){
      fbRootRef.child('sessions').child(sid).remove().catch(function(){});
    }
  });
}
function watchSessions(){
  try { const s = window.localStorage.getItem(CACHE_PREFIX+'sessions'); if(s) sessionsCache = JSON.parse(s); } catch(e) {}
  if(!firebaseReady || !fbRootRef) return;
  fbRootRef.child('sessions').on('value', function(snap){
    sessionsCache = snap.val() || {};
    try { window.localStorage.setItem(CACHE_PREFIX+'sessions', JSON.stringify(sessionsCache)); } catch(e) {}
    if(currentUser && mySessionId && !sessionsCache[mySessionId]){
      forceLocalLogout();
      return;
    }
    cleanupStaleSessions();
    if(currentUser && activeTab === 'sessions'){
      const formZone = document.getElementById('user-form-zone');
      const formOpen = formZone && formZone.innerHTML.trim() !== '';
      if(!formOpen) nav('sessions');
    }
  });
}
function writeMySession(){
  if(!currentUser || !mySessionId) return;
  const payload = {
    username: currentUser.username, nom: currentUser.nom, role: currentUser.role,
    loginAt: (sessionsCache[mySessionId] && sessionsCache[mySessionId].loginAt) || Date.now(),
    lastSeen: Date.now(), device: shortDevice()
  };
  sessionsCache[mySessionId] = payload;
  try { window.localStorage.setItem(CACHE_PREFIX+'sessions', JSON.stringify(sessionsCache)); } catch(e) {}
  if(firebaseReady && fbRootRef){
    fbRootRef.child('sessions').child(mySessionId).set(payload).catch(function(err){ console.error('Erreur session Firebase', err); });
  }
  cleanupStaleSessions();
}
function endMySession(){
  if(mySessionId){
    delete sessionsCache[mySessionId];
    try { window.localStorage.setItem(CACHE_PREFIX+'sessions', JSON.stringify(sessionsCache)); } catch(e) {}
    if(firebaseReady && fbRootRef){
      fbRootRef.child('sessions').child(mySessionId).remove().catch(function(){});
    }
  }
  if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; }
}
function forceLocalLogout(){
  currentUser = null; mySessionId = null; activeModule = null;
  try { window.sessionStorage.removeItem(CACHE_PREFIX+'user'); window.localStorage.removeItem(CACHE_PREFIX+'sid'); } catch(e) {}
  if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; }

  renderLogin('Votre session a été terminée par un administrateur.');

let memoryCache = {};
function getJSON(key, fallback){ 
  let fullKey = CACHE_PREFIX + key;
  if(memoryCache[fullKey] !== undefined) return JSON.parse(JSON.stringify(memoryCache[fullKey]));
  try { const v = window.localStorage.getItem(fullKey); if(v) { memoryCache[fullKey] = JSON.parse(v); return JSON.parse(v); } } catch(e) {} 
  return fallback; 
}
function setJSON(key, value){ 
  let fullKey = CACHE_PREFIX + key;
  memoryCache[fullKey] = JSON.parse(JSON.stringify(value));
  try { window.localStorage.setItem(fullKey, JSON.stringify(value)); } catch(e) {} 
  syncToFirebase(key, value);
}

function toISODateLocal(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Variables Globales
// --- Historique des postes opératrices (op1..op4) ---
// Chaque poste conserve la liste chronologique de qui l'a occupé, avec la date
// à partir de laquelle. Une donnée déjà enregistrée pour une date passée
// n'est JAMAIS réécrite : on consulte l'historique pour savoir qui occupait
// le poste ce jour-là, au lieu d'utiliser un nom "actuel" unique.
// Format : { op1: [{nom, dateDebut, actif}, ...], op2: [...], ... }
function getOpsHistoryRaw(){ return getJSON('ops_history', null); }
function saveOpsHistory(hist){ setJSON('ops_history', hist); }
function getOpsHistory(){
  const raw = getOpsHistoryRaw();
  if(raw) return raw;
  // Migration automatique et unique : les 4 noms déjà configurés deviennent le
  // premier (et seul) épisode de chaque poste, valide depuis toujours — aucune
  // donnée existante n'est donc modifiée par l'arrivée de cette fonctionnalité.
  const legacy = getJSON('ops', ["Hela", "Marwa", "Mabrouka", "Wahida"]);
  const migrated = {};
  OP_KEYS.forEach((k,i) => { migrated[k] = [{nom: legacy[i], dateDebut: '2000-01-01', actif: true}]; });
  saveOpsHistory(migrated);
  return migrated;
}
// Nom du poste opIdx (0-3) à la date donnée, ou null si poste inactif/vacant ce jour-là.
function getOpNameForDate(opIdx, dateISO){
  const hist = getOpsHistory();
  const episodes = (hist[OP_KEYS[opIdx]]||[]).filter(e => e.dateDebut <= dateISO);
  if(episodes.length===0) return null;
  const latest = episodes.reduce((a,b) => a.dateDebut > b.dateDebut ? a : b);
  return latest.actif ? latest.nom : null;
}
// Les 4 noms à une date donnée (placeholder si poste vacant ce jour-là).
function getOpsForDate(dateISO){
  return OP_KEYS.map((k,i) => getOpNameForDate(i, dateISO) || '(poste vacant)');
}
// Le poste opIdx est-il actif (occupé) à cette date ?
function isOpActiveOnDate(opIdx, dateISO){ return getOpNameForDate(opIdx, dateISO) !== null; }
function getOps() { return getOpsForDate(getTodayISO()); }
function getObjHoraireOp() { return getJSON('obj_horaire_op', 20); } // pièces/heure/opératrice (réf: 3 min/pièce)

// ============================================================
// HORAIRES CONFIGURABLES (Lot C) — Lun-Ven + Samedi
// ============================================================
// Valeurs par défaut = exactement les horaires codés en dur avant ce Lot
// (08h00-17h00, pause 12h00-12h30). Les libellés générés sont donc
// identiques caractère pour caractère à l'ancien tableau HOURS, pour
// que les données déjà saisies restent lisibles sans conversion.
function getScheduleSettings(){
  return getJSON('schedule', {
    weekdayStart:'08:00', weekdayEnd:'17:00', pauseStart:'12:00', pauseEnd:'12:30',
    saturdayEnabled: true, saturdayStart:'08:00', saturdayEnd:'12:00'
  });
}
function timeToMin(t){ const [h,m] = t.split(':').map(Number); return h*60+(m||0); }
function minToLabel(m){ const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,'0')+'h'+String(mm).padStart(2,'0'); }
function buildSlots(startStr, endStr, pauseStartStr, pauseEndStr){
  let slots = [];
  let cur = timeToMin(startStr);
  const end = timeToMin(endStr);
  const pStart = pauseStartStr ? timeToMin(pauseStartStr) : null;
  const pEnd = pauseEndStr ? timeToMin(pauseEndStr) : null;
  let guard = 0;
  while(cur < end && guard < 48){
    guard++;
    let next = Math.min(cur+60, end);
    slots.push({label: minToLabel(cur)+' - '+minToLabel(next), start:cur, end:next, minutes: next-cur});
    cur = next;
    if(pStart!=null && pEnd!=null && cur === pStart) cur = pEnd;
  }
  return slots;
}
function getSlotsForDate(dateISO){
  const sch = getScheduleSettings();
  const dow = new Date(dateISO+'T00:00:00').getDay(); // 0=dimanche ... 6=samedi
  if(dow === 0) return []; // dimanche non travaillé
  if(dow === 6) return sch.saturdayEnabled ? buildSlots(sch.saturdayStart, sch.saturdayEnd, null, null) : [];
  return buildSlots(sch.weekdayStart, sch.weekdayEnd, sch.pauseStart, sch.pauseEnd);
}
function getHoursForDate(dateISO){ return getSlotsForDate(dateISO).map(s=>s.label); }
function getHourDurationForDate(dateISO, h){
  const found = getSlotsForDate(dateISO).find(s=>s.label===h);
  return found ? found.minutes : 60;
}

function isAbsentMark(v){
  if(v === undefined || v === null) return false;
  const t = String(v).trim();
  if(t === '') return false; // case vide = pas encore saisi, pas une absence
  return isNaN(parseInt(t)); // texte non-numérique (ABS, CONGÉ...) = absence
}
function getActiveOpCount(h, dayData){
  if(!dayData || !dayData.hours || !dayData.hours[h]) return OP_KEYS.length;
  const dateISO = dayData.date || getTodayISO();
  let slotInfo; // calculé seulement si nécessaire
  return OP_KEYS.filter((k, idx) => {
    const val = dayData.hours[h][k];
    if(isAbsentMark(val)) return false; // saisie manuelle explicite (ABS...) = toujours prioritaire
    if(val!==undefined && val!==null && String(val).trim()!=='') return true; // chiffre saisi = pleinement comptée
    if(!isOpActiveOnDate(idx, dateISO)) return false; // poste inactif/vacant à cette date
    if(typeof rhSlotExcluded === 'function'){
      if(slotInfo === undefined) slotInfo = getSlotsForDate(dateISO).find(s=>s.label===h) || null;
      if(slotInfo && rhSlotExcluded(getOpNameForDate(idx, dateISO), dateISO, slotInfo.start, slotInfo.end)) return false;
    }
    return true;
  }).length;
}
function getHourTarget(h, dayData) {
  const dateISO = dayData && dayData.date ? dayData.date : getTodayISO();
  const duration = getHourDurationForDate(dateISO, h);
  if(!dayData || !dayData.hours || !dayData.hours[h]){
    return Math.round(getObjHoraireOp() * OP_KEYS.length * (duration/60));
  }
  let slotInfo;
  let sumFraction = 0;
  OP_KEYS.forEach((k, idx) => {
    const val = dayData.hours[h][k];
    if(isAbsentMark(val)){ return; } // saisie manuelle explicite (ABS...) = toujours prioritaire, fraction 0
    if(val!==undefined && val!==null && String(val).trim()!==''){ sumFraction += 1; return; } // chiffre saisi = pleinement comptée
    if(!isOpActiveOnDate(idx, dateISO)) return; // poste inactif/vacant à cette date -> fraction 0
    // case vide -> fraction proportionnelle d'après le statut RH du jour (1 si aucune donnée RH)
    if(typeof rhSlotFraction === 'function'){
      if(slotInfo === undefined) slotInfo = getSlotsForDate(dateISO).find(s=>s.label===h) || null;
      sumFraction += slotInfo ? rhSlotFraction(getOpNameForDate(idx, dateISO), dateISO, slotInfo.start, slotInfo.end) : 1;
    } else {
      sumFraction += 1;
    }
  });
  return Math.round(getObjHoraireOp() * sumFraction * (duration/60));
}
function getObjForDay(dayData){
  const dateISO = dayData && dayData.date ? dayData.date : getTodayISO();
  return getHoursForDate(dateISO).reduce((s, h) => s + getHourTarget(h, dayData), 0);
}
function getObj() {
  // Référence théorique affichée dans Params : semaine type (Lun-Ven), 4 opératrices, aucune absence.
  const sch = getScheduleSettings();
  const totalMin = buildSlots(sch.weekdayStart, sch.weekdayEnd, sch.pauseStart, sch.pauseEnd).reduce((s,sl)=>s+sl.minutes, 0);
  return Math.round(getObjHoraireOp() * OP_KEYS.length * (totalMin / 60));
}

// <60% critique · 60-79% insuffisant · 80-99% bon · ≥100% objectif atteint/dépassé
function rendClass(pct) { return pct >= 100 ? 'excellent' : (pct >= 80 ? 'good' : (pct >= 60 ? 'warn' : 'bad')); }
function rendLabel(pct) { return pct >= 100 ? 'Objectif atteint' : (pct >= 80 ? 'Bon' : (pct >= 60 ? 'Insuffisant' : 'Critique')); }
function paceLabel(pct) { return pct >= 100 ? 'En avance' : (pct >= 80 ? 'Bon' : (pct >= 60 ? 'Insuffisant' : 'Critique')); }

function getDay(date){
  let d = getJSON('prod_'+date, null);
  const scheduled = getHoursForDate(date);
  if(!d){ d = { date: date, status: 'draft', hours: {} }; scheduled.forEach(h => d.hours[h] = { op1:'', op2:'', op3:'', op4:'', obs:'' }); }
  else { scheduled.forEach(h => { if(!d.hours[h]) d.hours[h] = { op1:'', op2:'', op3:'', op4:'', obs:'' }; }); } // rattrape un changement d'horaires depuis la dernière saisie
  return d;
}
function saveDay(date, data){
  // Traçabilité : dernière personne ayant modifié ce jour (et quand).
  // La saisie étant auto-enregistrée à chaque champ, on ne garde qu'un
  // seul horodatage (pas un historique par frappe, qui gonflerait le stockage).
  data.lastEditBy = currentUser ? currentUser.nom : 'Inconnu';
  data.lastEditAt = Date.now();
  setJSON('prod_'+date, data);
}

function computeTotals(dayData){
  let totals = { op1:0, op2:0, op3:0, op4:0, totalGeneral:0, arrets:0 };
  const dayHours = getHoursForDate(dayData.date || getTodayISO());
  dayHours.forEach(h => {
    if(!dayData.hours[h]) return; // créneau introduit après la saisie (ex: horaires changés depuis) — ignoré proprement
    let rowTotal = 0;
    OP_KEYS.forEach(k => { 
      let val = parseInt(dayData.hours[h][k]) || 0; // Ignores text like "ABS"
      totals[k] += val; rowTotal += val; 
    });
    totals.totalGeneral += rowTotal;
    if(dayData.hours[h].obs && dayData.hours[h].obs.trim() !== '') totals.arrets++;
  });
  return totals;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ 
  clearTimeout(toastTimer); let t=document.getElementById('toast'); if(t) t.remove(); 
  t=document.createElement('div'); t.id='toast'; t.className='toast'; t.textContent=msg; 
  document.body.appendChild(t); toastTimer=setTimeout(()=>t.remove(),2500); 
}

async function loadProfileAndEnter(fbUser){
  try{
    const snap = await fbRootRef.child('users_v2/'+fbUser.uid).once('value');
    let profile = snap.val();
    if(!profile){
      // Amorçage : si AUCUN profil n'existe encore nulle part (tout premier compte
      // créé dans Firebase Console), on le déclare automatiquement Responsable.
      // Les règles Firebase autorisent toujours à écrire SON PROPRE profil.
      const allSnap = await fbRootRef.child('users_v2').once('value');
      if(!allSnap.exists()){
        profile = { nom: 'Resp. Magasin', username: (fbUser.email||'').split('@')[0], role: 'admin' };
        await fbRootRef.child('users_v2/'+fbUser.uid).set(profile);
        showToast('Premier compte initialisé en tant que Responsable. Modifiez le nom dans Sessions si besoin.');
      } else {
        console.error('Compte authentifié mais profil introuvable dans users_v2/'+fbUser.uid);
        await fbAuth.signOut();
        renderLogin("Compte non configuré côté application. Contactez le responsable.");
        return;
      }
    }
    currentUser = { uid: fbUser.uid, username: profile.username, nom: profile.nom, role: profile.role };
    try { window.sessionStorage.setItem(CACHE_PREFIX+'user', JSON.stringify(currentUser)); } catch(e) {}
    startSessionAndRender();
  }catch(err){
    console.error('Erreur de lecture du profil :', err);
    renderLogin("Erreur de connexion aux données. Vérifiez votre connexion internet.");
  }
}

function init(){
  initFirebase();
  if(firebaseConfigured() && fbAuth){
    // Mode sécurisé (Firebase Authentication) : l'état de connexion est géré par Firebase lui-même.
    fbAuth.onAuthStateChanged(function(fbUser){
      if(fbUser) loadProfileAndEnter(fbUser);
      else { currentUser = null; renderLogin(''); }
    });
  } else {
    // Mode local uniquement (Firebase non configuré) : ancien système simple, un seul appareil.
    try { let u = window.sessionStorage.getItem(CACHE_PREFIX+'user'); if(u) currentUser = JSON.parse(u); } catch(e) {}
    if(currentUser) startSessionAndRender(); else renderLogin('');
  }
}

function renderLogin(err){
  document.getElementById('app').innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-wrap" style="margin-bottom:24px;">
        <div class="logo-tt"><span class="t-blue">T</span><span class="t-black">T</span></div>
        <div class="logo-text"><span class="tek">TEK</span> <span class="trend">TREND</span></div>
        <div class="logo-sub">TECHNICAL WEAR</div>
      </div>
      <div class="login-error" style="display:${err ? 'block' : 'none'}">${err}</div>
      <form id="login-form">
        <div class="field"><label>Utilisateur</label><input type="text" id="login-user" required autocomplete="username"></div>
        <div class="field">
          <label>Mot de passe</label>
          <div class="pw-field">
            <input type="password" id="login-pass" required autocomplete="current-password">
            <button type="button" class="pw-toggle" onclick="togglePwVisibility()" aria-label="Afficher le mot de passe">${ICONS.eye}</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>
    </div>
  </div>`;
  window.togglePwVisibility = () => {
    const inp = document.getElementById('login-pass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  };
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const u = document.getElementById('login-user').value.trim(); const p = document.getElementById('login-pass').value;
    const btn = e.target.querySelector('button[type=submit]');
    const originalLabel = btn.textContent;
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Connexion...';

    if(firebaseConfigured() && fbAuth){
      // Mode sécurisé : Firebase Authentication (aucun mot de passe stocké par l'application)
      try{
        await fbAuth.signInWithEmailAndPassword(emailForUsername(u), p);
        // La suite (chargement du profil, affichage) est gérée par onAuthStateChanged dans init().
      }catch(err){
        console.error('Erreur de connexion Firebase Auth :', err.code, err.message);
        let msg = 'Identifiants incorrects.';
        if(err.code === 'auth/operation-not-allowed') msg = "Authentification par email/mot de passe non activée côté Firebase. L'administrateur doit l'activer dans la Console Firebase (voir instructions fournies).";
        else if(err.code === 'auth/too-many-requests') msg = 'Trop de tentatives. Réessayez dans quelques minutes.';
        else if(err.code === 'auth/network-request-failed') msg = 'Erreur réseau. Vérifiez votre connexion internet.';
        else if(err.code === 'auth/user-disabled') msg = 'Ce compte a été désactivé.';
        btn.disabled = false; btn.textContent = originalLabel;
        renderLogin(msg);
      }
    } else {
      // Mode local uniquement (Firebase non configuré) : ancien système, un seul appareil.
      const user = getLocalUsers().find(x => x.username === u && x.password === p);
      if(user){
        currentUser = user;
        try { window.sessionStorage.setItem(CACHE_PREFIX+'user', JSON.stringify(user)); } catch(e) {}
        startSessionAndRender();
      } else {
        btn.disabled = false; btn.textContent = originalLabel;
        renderLogin('Identifiants incorrects.');
      }
    }
  };
}

function logout(){
  endMySession();
  detachFirebaseDataListeners();
  currentUser = null; mySessionId = null; activeModule = null;
  try { window.sessionStorage.removeItem(CACHE_PREFIX+'user'); window.localStorage.removeItem(CACHE_PREFIX+'sid'); } catch(e) {}
  if(firebaseConfigured() && fbAuth){ fbAuth.signOut(); /* déclenche onAuthStateChanged -> renderLogin */ }
  else renderLogin('');
}

function buildNativeChart(labels, values, colorClass = '') {
  let maxVal = Math.max(...values, 1);
  const hasVariation = values.some(v=>v>0);
  const trueMax = hasVariation ? Math.max(...values) : null;
  const trueMin = hasVariation ? Math.min(...values.filter(v=>v>=0)) : null;
  let html = `<div class="native-chart">`;
  for(let i=0; i<labels.length; i++){
    let heightPct = (values[i] / maxVal) * 100;
    const isBest = hasVariation && values[i] === trueMax;
    const isWorst = hasVariation && values[i] === trueMin && trueMax !== trueMin;
    let extra = isBest ? ' best' : (isWorst ? ' worst' : '');
    html += `
      <div class="nc-col${extra}">
        <div class="nc-val" id="chart_val_${labels[i].replace(/\s/g,'')}">${values[i]}</div>
        <div class="nc-bar ${colorClass}" id="chart_bar_${labels[i].replace(/\s/g,'')}" style="height:${heightPct}%;"></div>
        <div class="nc-lbl">${labels[i]}</div>
      </div>
    `;
  }
  html += `</div>`; return html;
}

// Jauge circulaire de rendement (SVG natif, sans librairie)
function buildGauge(pct, neutral, onDark, size){
  size = size || 150;
  const r = 54, c = 2 * Math.PI * r;
  const visualPct = Math.max(0, Math.min(100, pct));
  const offset = c * (1 - visualPct / 100);
  const cls = rendClass(pct);
  const palette = onDark
    ? {bad:'#FF8177', warn:'#FFC067', good:'#5FE0A6', excellent:'#FFC72C'}
    : {bad:'var(--bad)', warn:'var(--warn)', good:'var(--good)', excellent:'var(--excellent)'};
  const colorVar = neutral ? (onDark ? 'rgba(255,255,255,.55)' : 'var(--ink-faint)') : palette[cls];
  const trackColor = onDark ? 'rgba(255,255,255,.16)' : null;
  const lblColor = onDark ? 'rgba(255,255,255,.6)' : null;
  const pctStr = (pct.toFixed ? pct.toFixed(1) : pct) + '%';
  let pctFontSize;
  if(size >= 140) pctFontSize = '26px';
  else if(size >= 115) pctFontSize = pctStr.length >= 6 ? '18px' : '21px';
  else pctFontSize = pctStr.length >= 6 ? '14px' : '17px';
  return `
    <div class="gauge-ring" style="width:${size}px;height:${size}px;">
      <svg width="${size}" height="${size}" viewBox="0 0 150 150">
        <circle class="track" cx="75" cy="75" r="${r}" ${trackColor?`style="stroke:${trackColor};"`:''}/>
        <circle class="prog" cx="75" cy="75" r="${r}" stroke="${colorVar}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="gauge-center">
        <div class="gauge-pct" style="color:${colorVar};font-size:${pctFontSize};">${pctStr}</div>
        <div class="gauge-lbl" ${lblColor?`style="color:${lblColor};font-size:${size<115?'8px':'10px'};"`:(size<115?'style="font-size:8px;"':'')}>Rendement</div>
      </div>
    </div>`;
}

// Dessine un graphique en barres sur un <canvas> caché et renvoie une image PNG
// (base64) — utilisé pour intégrer un graphique lisible dans l'export Excel,
// car les librairies Excel gratuites ne permettent pas de créer un graphique
// natif éditable, seulement d'insérer une image.
function renderChartToImage(labels, values, title, barColor){
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 420;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#0F3D66'; ctx.font = 'bold 18px Arial, sans-serif';
  ctx.fillText(title, 20, 28);

  const maxVal = Math.max(...values, 1);
  const chartTop = 55, chartBottom = 360, chartLeft = 50, chartRight = 770;
  const n = Math.max(values.length, 1);
  const gap = (chartRight - chartLeft) / n;
  const barWidth = Math.min(gap * 0.6, 70);

  ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(chartLeft, chartBottom); ctx.lineTo(chartRight, chartBottom); ctx.stroke();

  values.forEach((v, i) => {
    const h = maxVal > 0 ? (v / maxVal) * (chartBottom - chartTop) : 0;
    const x = chartLeft + i * gap + (gap - barWidth) / 2;
    const y = chartBottom - h;
    ctx.fillStyle = barColor || '#1F8F5F';
    ctx.fillRect(x, y, barWidth, Math.max(h, 1));
    ctx.fillStyle = '#111827'; ctx.font = 'bold 13px Arial, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(String(v), x + barWidth/2, y - 6);
    ctx.font = '12px Arial, sans-serif';
    ctx.fillText(labels[i] != null ? String(labels[i]) : '', x + barWidth/2, chartBottom + 20);
  });
  ctx.textAlign = 'left';
  return canvas.toDataURL('image/png');
}

// Logo TEK-TREND dessiné (même identité visuelle que l'application), utilisé
// en en-tête de chaque feuille de l'export Excel.
function renderLogoImage(){
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 90;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.fillStyle = '#0F3D66'; ctx.fillText('TEK', 6, 40);
  const tekWidth = ctx.measureText('TEK ').width;
  ctx.fillStyle = '#111827'; ctx.fillText('TREND', 6 + tekWidth, 40);
  ctx.font = '12px Arial, sans-serif'; ctx.fillStyle = '#5B6472';
  ctx.fillText('T E C H N I C A L   W E A R', 7, 62);
  return canvas.toDataURL('image/png');
}

// écoulés (entièrement ou partiellement) depuis le début de la journée.
// Sert UNIQUEMENT à donner un commentaire réaliste en cours de journée —
// ne remplace jamais le Rendement officiel (réel / objectif du jour × 100),
// qui reste affiché tel quel dans la jauge.
function getElapsedObjective(dayData, dateISO){
  const slots = getSlotsForDate(dateISO);
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  let elapsed = 0;
  slots.forEach(s => {
    // Un créneau ne compte que lorsqu'il est ENTIÈREMENT terminé (à sa propre
    // heure de fin — 9h, 10h... et pour le dernier créneau, souvent 30 min
    // après son début). Pas de calcul proportionnel à la minute en cours.
    if(nowMin >= s.end) elapsed += getHourTarget(s.label, dayData);
  });
  return elapsed;
}

    </div>

    <div class="card">
      <div style="display:flex;gap:8px;margin-bottom:6px;align-items:center;justify-content:space-between;flex-wrap:nowrap;">
        <h2 style="margin:0;display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap;"><span style="display:inline-flex;width:16px;height:16px;color:var(--accent);flex-shrink:0;">${ICONS.team}</span> Production par opératrice</h2>
        ${grandTotalOps>0 ? `<div style="font-size:9.5px;background:var(--accent-bg);color:var(--accent);padding:5px 8px;border-radius:9px;font-weight:700;white-space:nowrap;flex-shrink:0;">Moy. ${Math.round(grandTotalOps/Math.max(1,activeOpCount))} PC</div>` : ''}
      </div>
      ${grandTotalOps===0 ? buildEmptyState('Aucune donnée à afficher') : rankingOps.map((r,i) => `

        <div class="summary-item"><div class="si-icon" style="background:var(--accent-bg);color:var(--accent);">${ICONS.calendarCheck}</div><div style="min-width:0;overflow:hidden;"><div class="si-lbl">Objectif du jour</div><div class="si-val">${obj} PC</div></div></div>

      requestAnimationFrame(() => {

        if(fillEl) fillEl.style.width = Math.min(100, rendement) + '%';

function renderOperatriceDetail(opKey, data, ops, dayObj){
  const idx = OP_KEYS.indexOf(opKey);
  const name = ops[idx];
  const dayHours = getHoursForDate(data.date);
  let total = 0;
  const rows = dayHours.map(h => {
    const v = data.hours[h] ? data.hours[h][opKey] : '';
    const n = parseInt(v) || 0;
    total += n;
    const absent = isAbsentMark(v);
    return {h, v: absent ? 'ABS' : (v===''||v==null?'—':n), absent};
  });
  const zone = document.getElementById('operatrice-modal-zone');
  if(!zone) return;
  zone.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeOperatriceDetail()">
      <div class="modal-sheet">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="kpi-ic-badge blue" style="width:44px;height:44px;">${ICONS.team}</div>
            <div><h2 style="margin:0;">${esc(name)}</h2><div class="muted" style="font-size:12px;">${data.date.split('-').reverse().join('/')}</div></div>
          </div>
          <button class="icon-btn" onclick="closeOperatriceDetail()">✕</button>
        </div>
        <div class="kpi-grid" style="margin-bottom:14px;">
          <div class="kpi"><div class="label">Total aujourd'hui</div><div class="value">${total} <span style="font-size:12px;color:var(--ink-faint);">PC</span></div></div>
          <div class="kpi"><div class="label">Part de l'équipe</div><div class="value">${computeTotals(data).totalGeneral>0?Math.round(total/computeTotals(data).totalGeneral*100):0}%</div></div>
        </div>
        <h3>Détail par créneau</h3>
        <table>
          <thead><tr><th>Horaire</th><th class="num" style="text-align:right;">Pièces</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr><td>${r.h}</td><td style="text-align:right;font-family:var(--mono);font-weight:700;${r.absent?'color:var(--bad);':''}">${r.v}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
window.closeOperatriceDetail = () => { const z = document.getElementById('operatrice-modal-zone'); if(z) z.innerHTML=''; };

// --- ONGLET 2: SAISIE (AVEC INPUTS) ---
window.toggleValidation = (date, status) => {
  let d = getDay(date); d.status = status; saveDay(date, d);
  if(activeTab === 'saisie') renderSaisie(document.getElementById('main'), date);
  showToast(status === 'validated' ? "Journée Validée et Verrouillée" : "Saisie Déverrouillée");
};

function renderSaisie(container, date){
  const data = getDay(date); const totals = computeTotals(data);
  const ops = getOpsForDate(date); const obj = getObjForDay(data);
  const dayHours = getHoursForDate(date);
  const dayHoursSlots = getSlotsForDate(date);
  const rhSummary = typeof rhDaySummaryForOps === 'function' ? rhDaySummaryForOps(ops, date) : [];
  const isAdmin = canSaisie(currentUser.role);
  const isDraft = data.status === 'draft';
  const disabled = (isAdmin && isDraft) ? '' : 'disabled';

  if(dayHours.length === 0){
    container.innerHTML = `
      <div class="card">
        <div class="flex-header no-print">
          <h2 style="margin:0; color:var(--accent);">ESPACE SAISIE</h2>
          <div class="actions">${isAdmin ? `<input type="date" value="${date}" max="${getTodayISO()}" onchange="changeSaisieDate(this.value)" style="padding:8px 10px; border:1px solid var(--border); border-radius:8px;">` : ''}</div>
        </div>
        ${buildEmptyState("Jour non travaillé", "Aucun créneau n'est programmé pour le "+date.split('-').reverse().join('/')+" (voir Paramètres → Horaires).")}
      </div>`;
    window.changeSaisieDate = (val) => { if(val){ saisieDate = val; nav('saisie'); } };
    return;
  }

  let badgeHtml = !isAdmin ? `<span class="badge red">Lecture Seule</span>` : (isDraft ? `<span class="badge orange">Brouillon</span>` : `<span class="badge green">Validé</span>`);
  let actionBtns = isAdmin ? (isDraft ? `<button class="btn btn-success" onclick="toggleValidation('${date}', 'validated')">Verrouiller & Valider</button>` : `<button class="btn btn-warning" onclick="toggleValidation('${date}', 'draft')">Déverrouiller pour saisie et correction</button>`) : '';

  window.handleInput = (h, k, val) => {
    // Validation : on n'accepte qu'un nombre positif ou un texte d'absence (ABS, etc.)
    const trimmed = String(val).trim();
    if(trimmed !== '' && !isAbsentMark(trimmed)){
      const n = parseInt(trimmed);
      if(isNaN(n) || n < 0 || String(n) !== trimmed){
        showToast('Valeur invalide : entrez un nombre positif ou "ABS"');
        return;
      }
    }
    data.hours[h][k] = val; saveDay(date, data);
    let newTots = computeTotals(data);
    OP_KEYS.forEach(opKey => document.getElementById(`tot_col_${opKey}`).innerText = newTots[opKey]);
    document.getElementById('tot_gen').innerText = newTots.totalGeneral;
    
    let runCumul = 0;
    dayHours.forEach(hour => {
      let rTot = OP_KEYS.reduce((sum, opKey) => sum + (parseInt(data.hours[hour][opKey])||0), 0);
      runCumul += rTot; let hId = hour.replace(/\s+/g,'');
      let target = getHourTarget(hour, data);
      let pct = target > 0 ? Math.round(rTot / target * 100) : 0;
      let cell = document.getElementById(`tot_${hId}`);
      if(cell) cell.innerHTML = `${rTot}<div class="hour-rend ${rendClass(pct)}">${pct}%</div>`;
      if(document.getElementById(`cumul_${hId}`)) document.getElementById(`cumul_${hId}`).innerText = runCumul;
    });

    let newObj = getObjForDay(data);
    let newRend = newObj > 0 ? Math.round(newTots.totalGeneral / newObj * 100) : 0;
    let dayBadge = document.getElementById('day-rend-badge');
    if(dayBadge){ dayBadge.textContent = newRend + '%'; dayBadge.className = 'hour-rend ' + rendClass(newRend); }
    let dayObjLbl = document.getElementById('day-obj-label');
    if(dayObjLbl) dayObjLbl.textContent = newObj;
    let dayMiniBar = document.getElementById('day-mini-bar');
    if(dayMiniBar){ dayMiniBar.className = rendClass(newRend); dayMiniBar.style.width = Math.min(100,newRend) + '%'; }

    let maxVal = Math.max(...OP_KEYS.map(opKey => newTots[opKey]), 1);
    OP_KEYS.forEach((opKey, index) => {
      let safeName = ops[index].replace(/\s/g,'');
      let bVal = document.getElementById(`chart_val_${safeName}`); let bBar = document.getElementById(`chart_bar_${safeName}`);
      if(bVal) bVal.innerText = newTots[opKey];
      if(bBar) bBar.style.height = (newTots[opKey] / maxVal * 100) + '%';
    });
  };
  window.handleObs = (h, val) => { data.hours[h].obs = val; saveDay(date, data); };
  window.changeSaisieDate = (val) => { if(val){ saisieDate = val; nav('saisie'); } };

  let rows = ''; let cumulGeneral = 0;
  dayHours.forEach(h => {
    let rTot = OP_KEYS.reduce((sum, k) => sum + (parseInt(data.hours[h][k])||0), 0);
    cumulGeneral += rTot; let hId = h.replace(/\s+/g,'');
    let hTarget = getHourTarget(h, data);
    let hPct = hTarget > 0 ? Math.round(rTot / hTarget * 100) : 0;
    rows += `<tr>
      <td style="font-size:11px; font-weight:600; color:var(--ink-soft);">${h.replace(' - ','<br>')}</td>
      ${OP_KEYS.map((k, idx) => {
        const val = data.hours[h][k];
        let ph = '-';
        if((val===undefined||val===null||String(val).trim()==='') && typeof rhSlotExcluded==='function'){
          const slotInfo = dayHoursSlots.find(s=>s.label===h);
          if(slotInfo && rhSlotExcluded(ops[idx], date, slotInfo.start, slotInfo.end)) ph = 'RH';
        }
        return `<td class="input-cell"><input type="text" value="${val}" oninput="handleInput('${h}', '${k}', this.value)" ${disabled} placeholder="${ph}"></td>`;
      }).join('')}
      <td class="total-col" id="tot_${hId}">${rTot}<div class="hour-rend ${rendClass(hPct)}">${hPct}%</div></td>
      <td class="cumul-col" id="cumul_${hId}">${cumulGeneral}</td>
      <td class="input-cell obs-cell"><input type="text" value="${data.hours[h].obs}" onchange="handleObs('${h}', this.value)" placeholder="Cause, ABS..." ${disabled}></td>
    </tr>`;
  });

  container.innerHTML = `
    <div class="card" style="padding-bottom: 24px; border-top: 4px solid var(--accent);">
      <div class="flex-header no-print">
        <div>
          <h2 style="margin:0; color:var(--accent);">ESPACE SAISIE</h2>
          <div style="font-size:13px; font-weight:bold; margin-top:4px;">Date : ${date.split('-').reverse().join('/')} ${badgeHtml}</div>
          <div style="font-size:12.5px; color:var(--ink-soft); margin-top:4px;">Objectif jour (ajusté absences) : <b id="day-obj-label">${obj}</b> pièces · Rendement : <span id="day-rend-badge" class="hour-rend ${rendClass(obj>0?Math.round(totals.totalGeneral/obj*100):0)}" style="font-size:13px;">${obj>0?Math.round(totals.totalGeneral/obj*100):0}%</span></div>
          <div class="mini-gauge" style="max-width:220px;"><div id="day-mini-bar" class="${rendClass(obj>0?Math.round(totals.totalGeneral/obj*100):0)}" style="width:${Math.min(100,obj>0?Math.round(totals.totalGeneral/obj*100):0)}%;"></div></div>
          ${data.lastEditBy ? `<div style="font-size:11px; color:var(--ink-faint); margin-top:6px;">Dernière modification par <b>${data.lastEditBy}</b>, ${new Date(data.lastEditAt).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
        </div>
        <div class="actions" style="align-items:center;">
          ${isAdmin ? `<input type="date" value="${date}" max="${getTodayISO()}" onchange="changeSaisieDate(this.value)" style="padding:8px 10px; border:1px solid var(--border); border-radius:8px;">` : ''}
