        <span style="font-size:11px;font-weight:700;color:var(--ink-soft);">Statut RH aujourd'hui :</span>
        ${rhSummary.map(s => `<span class="hour-rend ${s.cls}" style="font-size:11px;">${s.opName} · ${s.label}</span>`).join('')}
      </div>` : ''}

      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>Horaires</th>${ops.map(o=>`<th style="text-align:center;">${o}</th>`).join('')}<th>Total/h</th><th>Cumul</th><th>Observations</th></tr>
          </thead>
          <tbody>
            ${rows}
            <tr class="total-row">
              <td>TOTAL JOUR</td>
              ${OP_KEYS.map(k=>`<td class="total-col" id="tot_col_${k}">${totals[k]}</td>`).join('')}
              <td class="total-col" id="tot_gen" style="background:var(--accent);color:#fff;font-size:16px;">${totals.totalGeneral}</td>
              <td class="cumul-col">-</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
      <h3 style="margin: 20px 0 0; font-size:14px; text-align:center;" class="no-print">Répartition (Temps Réel)</h3>
      <div class="no-print">${buildNativeChart(ops, OP_KEYS.map(k => totals[k]), 'green')}</div>
    </div>
  `;
}

// --- ONGLET 3: HISTORIQUE (SANS INPUTS, LECTURE SEULE) ---
window.editPastDate = (date) => { saisieDate = date; nav('saisie'); };
window.loadHist = () => { histDate = document.getElementById('hist-date').value; nav('historique'); };

function renderHistorique(container){
  const data = getDay(histDate); const totals = computeTotals(data); const ops = getOpsForDate(histDate);
  const dayHours = getHoursForDate(histDate);
  let rows = ''; let cumulGeneral = 0;
  
  dayHours.forEach(h => {
    let rTot = OP_KEYS.reduce((sum, k) => sum + (parseInt(data.hours[h][k])||0), 0);
    cumulGeneral += rTot;
    let hTarget = getHourTarget(h, data);
    let hPct = hTarget > 0 ? Math.round(rTot / hTarget * 100) : 0;
    rows += `<tr>
      <td style="font-size:11px; font-weight:600; color:var(--ink-soft);">${h.replace(' - ','<br>')}</td>
      ${OP_KEYS.map(k => `<td class="hist-cell">${data.hours[h][k] || '-'}</td>`).join('')}
      <td class="total-col">${rTot}<div class="hour-rend ${rendClass(hPct)}">${hPct}%</div></td>
      <td class="cumul-col">${cumulGeneral}</td>
      <td class="hist-obs">${data.hours[h].obs || ''}</td>
    </tr>`;
  });

  const obj = getObjForDay(data);
  const rendJour = obj > 0 ? Math.round(totals.totalGeneral / obj * 100) : 0;

  const viewToggle = `
    <div class="segmented" style="display:flex;gap:6px;margin-bottom:10px;">
      <button class="btn ${histViewMode==='jour'?'btn-primary':'btn-ghost'}" style="padding:7px 14px;font-size:12.5px;" onclick="histViewMode='jour'; nav('historique')">Vue Jour</button>
      <button class="btn ${histViewMode==='periode'?'btn-primary':'btn-ghost'}" style="padding:7px 14px;font-size:12.5px;" onclick="histViewMode='periode'; nav('historique')">Vue Période</button>
    </div>`;

  if(histViewMode === 'periode'){
    let rowsP = '';
    let curr = new Date(histPeriodStart+'T00:00:00'); let end = new Date(histPeriodEnd+'T00:00:00');
    let list = [];
    if(curr <= end){
      let g=0;
      while(curr<=end && g<93){
        let iso = toISODateLocal(curr);
        let d = getDay(iso); let t = computeTotals(d); let o = getObjForDay(d);
        if(o > 0) list.push({iso, total:t.totalGeneral, rend: o>0?Math.round(t.totalGeneral/o*100):0, status:d.status, lastEditBy:d.lastEditBy});
        curr.setDate(curr.getDate()+1); g++;
      }
    }
    rowsP = list.map(d=>`<tr style="cursor:pointer;" onclick="histDate='${d.iso}'; histViewMode='jour'; nav('historique')">
      <td>${d.iso.split('-').reverse().join('/')}</td>
      <td class="total-col">${d.total}</td>
      <td class="total-col"><span class="hour-rend ${rendClass(d.rend)}">${d.rend}%</span></td>
      <td>${d.status==='validated'?'<span class="badge green">Validé</span>':'<span class="badge orange">Brouillon</span>'}</td>
      <td style="font-size:11px;color:var(--ink-soft);">${d.lastEditBy||'—'}</td>
    </tr>`).join('');

    container.innerHTML = `
      <div class="flex-header no-print">
        <div></div>
        <div class="actions">
          <button class="btn btn-primary" onclick="exportPeriodExcel()">${ICONS.export} Excel (période complète)</button>
          <button class="btn btn-ghost" onclick="exportCSV()">${ICONS.export} Excel (jour sélectionné)</button>
        </div>
      </div>
      <div class="card">
        ${viewToggle}
        <div class="flex-header" style="margin-bottom:0;">
          <div class="field" style="margin:0;flex:1;"><label>Du :</label><input type="date" id="hist-p-start" value="${histPeriodStart}" onchange="updateHistPeriod()"></div>
          <div class="field" style="margin:0;flex:1;"><label>Au :</label><input type="date" id="hist-p-end" value="${histPeriodEnd}" onchange="updateHistPeriod()"></div>
        </div>
      </div>
      <div class="card">
        ${list.length===0 ? buildEmptyState("Aucun jour travaillé sur cette période") : `
          <table>
            <thead><tr><th>Date</th><th>Total</th><th>Rendement</th><th>Statut</th><th>Modifié par</th></tr></thead>
            <tbody>${rowsP}</tbody>
          </table>
          <div style="font-size:11px;color:var(--ink-faint);margin-top:10px;">Touchez une ligne pour voir le détail du jour.</div>
        `}
      </div>
    `;
    window.updateHistPeriod = () => {
      histPeriodStart = document.getElementById('hist-p-start').value;
      histPeriodEnd = document.getElementById('hist-p-end').value;
      nav('historique');
    };
    return;
  }

  container.innerHTML = `
    <div class="flex-header no-print">
      <input type="date" id="hist-date" value="${histDate}" onchange="loadHist()">
      <div class="actions">
        <button class="btn btn-ghost" onclick="window.print()">${ICONS.export} PDF</button>
        <button class="btn btn-ghost" onclick="exportCSV()">${ICONS.export} Excel</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:0;padding-bottom:10px;">${viewToggle}</div>
    
    <div class="card" style="padding-bottom: 24px; border-top: 4px solid var(--ink-soft);">
      <div class="flex-header">
        <div>
          <h2 style="margin:0; color:var(--ink-soft);">MODE CONSULTATION (Lecture Seule)</h2>
          <div style="font-size:13px; font-weight:bold; margin-top:4px;">Date : ${histDate.split('-').reverse().join('/')} ${data.status === 'validated' ? '<span class="badge green">Validé</span>' : '<span class="badge orange">Brouillon</span>'} · Rendement jour : <span class="hour-rend ${rendClass(rendJour)}" style="font-size:13px;">${rendJour}%</span></div>
          <div class="mini-gauge" style="max-width:220px;"><div class="${rendClass(rendJour)}" style="width:${Math.min(100,rendJour)}%;"></div></div>
          ${data.lastEditBy ? `<div style="font-size:11px; color:var(--ink-faint); margin-top:6px;">Dernière modification par <b>${data.lastEditBy}</b>, ${new Date(data.lastEditAt).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
        </div>
      </div>
      ${dayHours.length===0 ? buildEmptyState("Jour non travaillé", "Aucun créneau n'est programmé ce jour-là (voir Paramètres → Horaires).") : (totals.totalGeneral===0 ? buildEmptyState("Aucune production enregistrée ce jour-là", "Vérifiez la date sélectionnée, ou saisissez les données si elles manquent.") : '')}
      
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>Horaires</th>${ops.map(o=>`<th style="text-align:center;">${o}</th>`).join('')}<th>Total/h</th><th>Cumul</th><th>Observations</th></tr>
          </thead>
          <tbody>
            ${rows}
            <tr class="total-row">
              <td>TOTAL JOUR</td>
              ${OP_KEYS.map(k=>`<td class="total-col">${totals[k]}</td>`).join('')}
              <td class="total-col" style="background:var(--accent);color:#fff;font-size:16px;">${totals.totalGeneral}</td>
              <td class="cumul-col">-</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
      
      ${canSaisie(currentUser.role) ? `
        <div style="margin-top:20px; text-align:center;" class="no-print">
          <button class="btn btn-warning" onclick="editPastDate('${histDate}')">✏️ Saisir / corriger les données de ce jour</button>
        </div>
      ` : ''}
    </div>
  `;
}

// --- ONGLET 4: STATISTIQUES (PLAGE DE DATES DYNAMIQUE) ---
window.updateStatRange = () => {
  const s = document.getElementById('stat-start').value;
  const e = document.getElementById('stat-end').value;
  if(!s || !e){ showToast('Merci de renseigner les deux dates'); return; }
  statRangeStart = s;
  statRangeEnd = e;
  statActivePeriod = 'perso';
  renderStats(document.getElementById('main'));
};

window.setStatPeriod = (period) => {
  const today = getTodayISO();
  if(period === 'jour'){ statRangeStart = today; statRangeEnd = today; }
  else if(period === 'semaine'){ statRangeStart = toISODateLocal(new Date(new Date().setDate(new Date().getDate()-6))); statRangeEnd = today; }
  else if(period === 'mois'){ statRangeStart = today.slice(0,8)+'01'; statRangeEnd = today; }
  statActivePeriod = period;
  renderStats(document.getElementById('main'));
};
let statActivePeriod = 'semaine';

function renderStats(container){
  const dateEndHours = getHoursForDate(statRangeEnd);
  let valsHourly = dateEndHours.map(h => OP_KEYS.reduce((sum, k) => sum + (parseInt((getDay(statRangeEnd).hours[h]||{})[k])||0), 0));

  // Construit un jour par jour sur la période (plafonné à 93 jours ~ 3 mois)
  let days = [];
  let curr = new Date(statRangeStart+'T00:00:00'); let end = new Date(statRangeEnd+'T00:00:00');
  const invalidStart = isNaN(curr.getTime());
  const invalidEnd = isNaN(end.getTime());
  let rangeError = '';
  if(invalidStart || invalidEnd) rangeError = "Date invalide — vérifiez les champs Du / Au ci-dessous.";
  else if(curr > end) rangeError = "La date de début est après la date de fin — corrigez les champs Du / Au ci-dessous.";

  if(!rangeError){
    let g = 0;
    while(curr <= end && g < 93){
      let iso = toISODateLocal(curr);
      let d = getDay(iso);
      let t = computeTotals(d);
      let obj = getObjForDay(d);
      days.push({ iso, total: t.totalGeneral, obj, rend: obj>0 ? (t.totalGeneral/obj*100) : 0, perOp: OP_KEYS.map(k=>t[k]) });
      curr.setDate(curr.getDate() + 1); g++;
    }
  }
  const workedDays = days.filter(d => d.obj > 0); // jours réellement programmés (hors dimanche / samedi désactivé)
  const activeDays = workedDays.filter(d => d.total > 0); // jours avec au moins une saisie

  const labelsDyn = activeDays.length ? activeDays.map(d=>shortDateFR(d.iso)) : ['-'];
  const valsDyn = activeDays.length ? activeDays.map(d=>d.total) : [0];
  const rendLabelsDyn = activeDays.length ? activeDays.map(d=>shortDateFR(d.iso)) : ['-'];
  const rendValsDyn = activeDays.length ? activeDays.map(d=>Math.round(d.rend)) : [0];

  // Le classement attribue chaque jour la production au nom qui occupait
  // réellement le poste CE jour-là (jamais le nom actuel/le plus récent) —
  // si quelqu'un a remplacé une autre en cours de période, les deux
  // apparaissent séparément avec leur propre total.
  const perNameTotals = {};
  activeDays.forEach(d => {
    const opsForDay = getOpsForDate(d.iso);
    OP_KEYS.forEach((k,i) => {
      const name = opsForDay[i];
      if(name === '(poste vacant)') return;
      perNameTotals[name] = (perNameTotals[name]||0) + d.perOp[i];
    });
  });
  const totalAll = Object.values(perNameTotals).reduce((s,v)=>s+v,0);
  const ranking = Object.entries(perNameTotals).map(([name,total])=>({name,total})).sort((a,b)=>b.total-a.total);

  const avgRend = activeDays.length ? activeDays.reduce((s,d)=>s+d.rend,0)/activeDays.length : 0;
  const bestDay = activeDays.length ? activeDays.reduce((a,b)=>b.rend>a.rend?b:a) : null;
  const worstDay = activeDays.length ? activeDays.reduce((a,b)=>b.rend<a.rend?b:a) : null;

  const noEvolutionData = activeDays.length === 0;
  const noHourlyData = valsHourly.every(v=>v===0) || dateEndHours.length===0;

  container.innerHTML = `
    <div class="card no-print" style="background:var(--surface-2);">
      <h3 style="margin-top:0; font-size:13px; color:var(--ink-soft);">Période d'analyse :</h3>
      <div class="segmented" style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
        <button class="btn ${statActivePeriod==='jour'?'btn-primary':'btn-ghost'}" style="padding:7px 14px;font-size:12.5px;" onclick="setStatPeriod('jour')">Jour</button>
        <button class="btn ${statActivePeriod==='semaine'?'btn-primary':'btn-ghost'}" style="padding:7px 14px;font-size:12.5px;" onclick="setStatPeriod('semaine')">7 jours</button>
        <button class="btn ${statActivePeriod==='mois'?'btn-primary':'btn-ghost'}" style="padding:7px 14px;font-size:12.5px;" onclick="setStatPeriod('mois')">Ce mois</button>
        <button class="btn ${statActivePeriod==='perso'?'btn-primary':'btn-ghost'}" style="padding:7px 14px;font-size:12.5px;" onclick="statActivePeriod='perso'; renderStats(document.getElementById('main'))">Personnalisé</button>
      </div>
      <div class="flex-header" style="margin-bottom:0;">
        <div class="field" style="margin:0; flex:1;"><label>Du :</label><input type="date" id="stat-start" value="${statRangeStart}" onchange="updateStatRange()"></div>
        <div class="field" style="margin:0; flex:1;"><label>Au :</label><input type="date" id="stat-end" value="${statRangeEnd}" onchange="updateStatRange()"></div>
      </div>
      ${rangeError ? `<div style="margin-top:10px;">${buildAlert('bad', rangeError)}</div>` : ''}
    </div>

    <div class="kpi-grid">
      <div class="kpi kpi-ic"><div class="kpi-ic-badge blue">${ICONS.box}</div><div><div class="kpi-ic-label">Production période</div><div class="kpi-ic-value">${totalAll} <span style="font-size:12px;color:var(--ink-faint);">PC</span></div></div></div>
      <div class="kpi kpi-ic"><div class="kpi-ic-badge ${rendClass(avgRend)==='bad'?'red':(rendClass(avgRend)==='excellent'?'gold':'green')}">${ICONS.target}</div><div><div class="kpi-ic-label">Rendement moyen</div><div class="kpi-ic-value ${rendClass(avgRend)}">${avgRend.toFixed(1)}%</div></div></div>
      ${activeDays.length >= 2 ? `
      <div class="kpi kpi-ic"><div class="kpi-ic-badge green">${ICONS.crown}</div><div><div class="kpi-ic-label">Meilleur jour</div><div class="kpi-ic-value" style="font-size:14px;">${bestDay.iso.split('-').reverse().join('/')}<br>${bestDay.total} PC (${Math.round(bestDay.rend)}%)</div></div></div>
      <div class="kpi kpi-ic"><div class="kpi-ic-badge red">${ICONS.pause}</div><div><div class="kpi-ic-label">Jour le plus faible</div><div class="kpi-ic-value" style="font-size:14px;">${worstDay.iso.split('-').reverse().join('/')}<br>${worstDay.total} PC (${Math.round(worstDay.rend)}%)</div></div></div>
      ` : ''}
    </div>

    <h2>Évolution du Rendement</h2>
    <div class="card">${noEvolutionData ? buildEmptyState("Aucune production sur cette période", "Essayez d'élargir la plage de dates.") : buildNativeChart(rendLabelsDyn, rendValsDyn, 'blue')}</div>

    <h2>Production Totale (pièces/jour)</h2>
    <div class="card">${noEvolutionData ? buildEmptyState("Aucune production sur cette période") : buildNativeChart(labelsDyn, valsDyn, 'green')}</div>

    <h2>Classement des Opératrices</h2>
    <div class="card">
      ${totalAll===0 ? buildEmptyState("Aucune donnée à classer sur cette période") : `
        <table>
          <thead><tr><th>#</th><th>Opératrice</th><th class="num" style="text-align:right;">Total pièces</th><th class="num" style="text-align:right;">Part</th></tr></thead>
          <tbody>
            ${ranking.map((r,i)=>`<tr>
              <td>${i+1}${i===0?' 🏆':''}</td>
              <td style="font-weight:700;">${r.name}</td>
              <td style="text-align:right;font-family:var(--mono);font-weight:700;">${r.total}</td>
              <td style="text-align:right;font-family:var(--mono);">${totalAll>0?Math.round(r.total/totalAll*100):0}%</td>
            </tr>`).join('')}
          </tbody>
        </table>
      `}
    </div>

    <h2>Production Horaire (${statRangeEnd.split('-').reverse().join('/')})</h2>
    <div class="card">${noHourlyData ? buildEmptyState(dateEndHours.length===0 ? "Jour non travaillé" : "Aucune donnée pour ce jour") : buildNativeChart(dateEndHours.map(h=>h.split(' - ')[1]), valsHourly, 'green')}</div>
  `;
}

// --- ONGLET 5: PARAMETRES (ADMIN) ---

  let sch = getScheduleSettings();
  container.innerHTML = `
    <div class="flex-header"><h2>Paramètres de l'Atelier</h2></div>
    <div class="card">
      <h3 style="margin-top:0;">Cadence de Référence</h3>

      </div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5;">
        Référence actuelle : <b>3 min/pièce</b> (soit ${rate} pièces/h et par opératrice).<br>
        Objectif théorique semaine type (Lun-Ven, ${OP_KEYS.length} opératrices) : <b>${obj} pièces/jour</b>.<br>

      <div class="kpi-grid" style="margin-bottom:14px;">

        <div class="field" style="margin:0;"><label>Pause fin</label><input type="time" id="sch_pend" value="${sch.pauseEnd}"></div>

      <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-bottom:8px;">
        <input type="checkbox" id="sch_sat_enabled" ${sch.saturdayEnabled?'checked':''} style="width:16px;height:16px;"> Samedi travaillé
      </div>
      <div class="kpi-grid">
        <div class="field" style="margin:0;"><label>Début</label><input type="time" id="sch_sstart" value="${sch.saturdayStart}"></div>
        <div class="field" style="margin:0;"><label>Fin</label><input type="time" id="sch_send" value="${sch.saturdayEnd}"></div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-faint);margin-top:8px;">Dimanche : toujours non travaillé.</div>
      
      <hr style="border:0; border-top:1px solid var(--border); margin:24px 0;">

      <h3>Postes opératrices</h3>

      ${OP_KEYS.map((k, i) => {
        const hist = (getOpsHistory()[k]||[]).slice().sort((a,b)=>b.dateDebut.localeCompare(a.dateDebut));
        const current = hist[0];

        <div class="card" style="background:var(--surface-2);margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">

            ${hist.map(e => `<div style="font-size:11.5px;color:var(--ink-soft);padding:3px 0;">${e.dateDebut.split('-').reverse().join('/')} → ${e.actif ? esc(e.nom) : 'poste rendu inactif'}</div>`).join('')}
          </div>
          <div style="display:flex;gap:8px;margin-top:10px;">

            <input type="date" id="op-new-date-${i}" value="${getTodayISO()}" style="max-width:140px;">

          </div>
        </div>
        `;
      }).join('')}

      <button class="btn btn-primary btn-block" style="margin-top:15px;" onclick="saveParams()">Enregistrer les paramètres</button>
    </div>
  `;

    if(el) el.style.display = (el.style.display==='none' || !el.style.display) ? 'block' : 'none';
  };
  window.addOpEpisode = (i) => {
    const name = document.getElementById('op-new-name-'+i).value.trim();
    const date = document.getElementById('op-new-date-'+i).value;
    if(!name){ showToast('Indiquez le nom de la remplaçante'); return; }
    if(!date){ showToast('Indiquez une date'); return; }
    const hist = getOpsHistory();
    const k = OP_KEYS[i];
    const latest = (hist[k]||[]).reduce((a,b)=> (!a || b.dateDebut > a.dateDebut) ? b : a, null);
    if(latest && date <= latest.dateDebut){ showToast("La date doit être postérieure au "+latest.dateDebut.split('-').reverse().join('/')+" (dernier changement)."); return; }
    hist[k] = [...(hist[k]||[]), {nom:name, dateDebut:date, actif:true}];
    saveOpsHistory(hist);
    showToast('Poste mis à jour à partir du '+date.split('-').reverse().join('/'));
    nav('params');
  };
  window.setOpInactive = (i) => {
    const date = document.getElementById('op-new-date-'+i).value || getTodayISO();
    const hist = getOpsHistory();
    const k = OP_KEYS[i];
    const latest = (hist[k]||[]).reduce((a,b)=> (!a || b.dateDebut > a.dateDebut) ? b : a, null);
    if(latest && date <= latest.dateDebut){ showToast("La date doit être postérieure au "+latest.dateDebut.split('-').reverse().join('/')+" (dernier changement)."); return; }
    if(!confirm(`Marquer le Poste ${i+1} comme inactif à partir du ${date.split('-').reverse().join('/')} ?\n\nLes données déjà saisies pour les jours passés restent inchangées.`)) return;
    hist[k] = [...(hist[k]||[]), {nom:null, dateDebut:date, actif:false}];
    saveOpsHistory(hist);
    showToast('Poste marqué inactif à partir du '+date.split('-').reverse().join('/'));
    nav('params');
  };
  
  window.saveParams = () => {
    let v = parseInt(document.getElementById('setting_rate').value);
    if(!isNaN(v) && v > 0) setJSON('obj_horaire_op', v);

    const wstart = document.getElementById('sch_wstart').value;
    const wend = document.getElementById('sch_wend').value;
    const pstart = document.getElementById('sch_pstart').value;
    const pend = document.getElementById('sch_pend').value;
    const satEnabled = document.getElementById('sch_sat_enabled').checked;
    const sstart = document.getElementById('sch_sstart').value;
    const send = document.getElementById('sch_send').value;

    if(!wstart || !wend || wstart >= wend){ showToast("Horaires semaine invalides : l'heure de fin doit être après le début."); return; }
    if(pstart && pend && pstart >= pend){ showToast("Pause invalide : l'heure de fin doit être après le début."); return; }
    if(pstart && (pstart < wstart || pstart > wend)){ showToast("La pause doit être comprise dans les horaires de la journée."); return; }
    if(satEnabled && (!sstart || !send || sstart >= send)){ showToast("Horaires du samedi invalides."); return; }

    setJSON('schedule', {
      weekdayStart: wstart, weekdayEnd: wend, pauseStart: pstart||null, pauseEnd: pend||null,
      saturdayEnabled: satEnabled, saturdayStart: sstart, saturdayEnd: send
    });

    showToast("Paramètres appliqués avec succès !");
    nav('params');
  };
}

function getMessages(){ return getJSON('messages', {}); }

// --- Badge "non lu" sur l'onglet Messages ---
function getLastSeenMessages(){
  try { return parseInt(window.localStorage.getItem(CACHE_PREFIX+'msg_seen_'+currentUser.username)) || 0; } catch(e){ return 0; }
}
function setLastSeenMessagesNow(){
  try { window.localStorage.setItem(CACHE_PREFIX+'msg_seen_'+currentUser.username, String(Date.now())); } catch(e) {}
}
function getUnreadMessageCount(){
  if(!currentUser) return 0;
  const msgs = getMessages();
  const lastSeen = getLastSeenMessages();
  return Object.values(msgs).filter(m => (m.at||0) > lastSeen && m.authorUsername !== currentUser.username).length;
}
function updateNavBadges(){
  const unread = getUnreadMessageCount();
  document.querySelectorAll('.nav-badge').forEach(el => el.remove());
  if(unread > 0){
    document.querySelectorAll('[data-tab="messages"] .nav-icon-wrap').forEach(wrap => {
      const dot = document.createElement('span');
      dot.className = 'nav-badge';
      wrap.appendChild(dot);
    });
  }
}

// --- Notifications système (tant que l'app reste ouverte, même en arrière-plan) ---
// IMPORTANT : ceci ne fonctionne QUE si l'application est encore chargée en
// mémoire (onglet ouvert, même non actif). Si l'application est complètement
// fermée, aucune notification ne peut arriver — cela nécessiterait un serveur
// d'envoi (Firebase Cloud Functions, payant), ce qui n'est pas mis en place ici.
let knownMessageIds = null;
function checkForNewMessages(allData){
  const msgs = (allData && allData.messages) || {};
  const ids = Object.keys(msgs);
  if(knownMessageIds === null){
    knownMessageIds = new Set(ids); // premier chargement : pas de notification rétroactive
    return;
  }
  ids.forEach(id => {
    if(!knownMessageIds.has(id)){
      knownMessageIds.add(id);
      const m = msgs[id];
      if(currentUser && m.authorUsername !== currentUser.username) notifyNewMessage(m);
    }
  });
}
function notifyNewMessage(m){
  updateNavBadges();
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const title = 'TEK-TREND — ' + (m.authorName || 'Nouveau message');
  const opts = { body: m.text, icon: './icon-192.png', tag: 'tek-trend-msg-'+Date.now() };
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){ reg.showNotification(title, opts); }).catch(function(){ new Notification(title, opts); });
    } else {
      new Notification(title, opts);
    }
  }catch(e){ console.error('Erreur notification :', e); }
}
window.requestNotifPermission = () => {
  if(typeof Notification === 'undefined'){ showToast("Les notifications ne sont pas prises en charge par ce navigateur."); return; }
  Notification.requestPermission().then(function(perm){
    if(perm === 'granted') showToast('Notifications activées !');
    else showToast('Notifications refusées — vous pouvez les activer plus tard dans les réglages du navigateur.');
    nav('messages');
  });
};

function timeAgoOrDate(ts){
  if(!ts) return '';
  const diff = Date.now() - ts;
  if(diff < 24*3600000) return timeAgo(ts);
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

    <div class="alert warn" style="cursor:pointer;" onclick="requestNotifPermission()">

    ${notifStatus === 'denied' ? `<div class="alert bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/></svg><span>Notifications refusées. Pour les réactiver : réglages du navigateur → autorisations du site.</span></div>` : ''}
    <div class="card">
      <p style="font-size:12px;color:var(--ink-soft);margin-top:0;">Visible par le Responsable, la Direction et le Chef de chaîne. Utilisez-le pour signaler un problème ou laisser une consigne.</p>
      <div class="field"><label>Nouveau message</label><textarea id="msg-text" rows="3" style="width:100%;padding:11px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);font-family:inherit;font-size:15px;resize:vertical;" placeholder="Écrire un message…"></textarea></div>
      <button class="btn btn-primary" onclick="sendMessage()">Envoyer</button>
    </div>
    <div class="card">
      ${list.length === 0 ? buildEmptyState("Aucun message pour l'instant", "Le premier message envoyé apparaîtra ici pour tout le monde.") : list.map(([id, m]) => `
        <div class="session-row" style="align-items:flex-start;">
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;">
              <b>${esc(m.authorName || m.authorUsername || 'Inconnu')}</b>
              <span class="badge ${roleBadgeClass(m.authorRole)}" style="font-size:9.5px;">${roleLabel(m.authorRole)}</span>
              <span style="font-size:11px;color:var(--ink-faint);">${timeAgoOrDate(m.at)}</span>
            </div>
            <div style="font-size:14px;white-space:pre-wrap;word-break:break-word;">${esc(m.text)}</div>

          ${(currentUser.role === 'admin' || m.authorUsername === currentUser.username) ? `<button class="icon-btn" style="flex-shrink:0;" onclick="deleteMessage('${id}')" title="Supprimer">${ICONS.trash || '✕'}</button>` : ''}
        </div>
      `).join('')}
    </div>
  `;

  window.sendMessage = () => {
    const el = document.getElementById('msg-text');
    const text = el.value.trim();
    if(!text){ showToast('Écrivez un message avant d\'envoyer'); return; }
    const id = 'm' + Date.now() + Math.floor(Math.random()*1000);
    const all = getMessages();
    all[id] = { text, authorName: currentUser.nom, authorUsername: currentUser.username, authorRole: currentUser.role, at: Date.now() };
    setJSON('messages', all);
    el.value = '';
    showToast('Message envoyé');
    nav('messages');
  };
  window.deleteMessage = (id) => {
    if(!confirm('Supprimer ce message ?')) return;
    const all = getMessages();
    delete all[id];
    setJSON('messages', all);
    nav('messages');
  };
}

// --- EXPORT EXCEL DE LA PÉRIODE (multi-feuilles + graphique) ---
window.exportPeriodExcel = async () => {
  if(typeof ExcelJS === 'undefined'){
    showToast("Bibliothèque Excel indisponible — vérifiez votre connexion internet et réessayez.");
    return;
  }
  const startISO = histPeriodStart, endISO = histPeriodEnd;
  let curr = new Date(startISO+'T00:00:00'); let end = new Date(endISO+'T00:00:00');
  if(isNaN(curr.getTime()) || isNaN(end.getTime()) || curr > end){
    showToast("Période invalide : vérifiez les dates Du / Au.");
    return;
  }
  showToast("Génération du fichier Excel…");
  const periodLabel = startISO.split('-').reverse().join('/') + ' au ' + endISO.split('-').reverse().join('/');

  // Reconstitue la liste des jours réellement programmés sur la période
  let list = [];
  let g = 0;
  while(curr <= end && g < 93){
    let iso = toISODateLocal(curr);
    let d = getDay(iso); let t = computeTotals(d); let o = getObjForDay(d);
    if(o > 0) list.push({ iso, day: d, totals: t, obj: o, rend: o>0 ? (t.totalGeneral/o*100) : 0 });
    curr.setDate(curr.getDate()+1); g++;
  }
  if(list.length === 0){ showToast("Aucune donnée sur cette période."); return; }

  const ops = getOpsForDate(endISO); // noms à la fin de la période exportée (plus pertinent que "aujourd'hui")
  const workbook = new ExcelJS.Workbook();
  workbook.creator = 'TEK-TREND';
  workbook.created = new Date();

  const headerFill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF0F3D66'}};
  const headerFont = {bold:true, color:{argb:'FFFFFFFF'}};
  const logoImg = renderLogoImage();
  const logoImageId = workbook.addImage({ base64: logoImg, extension: 'png' });
  const DATA_START_ROW = 6; // ligne 1-3 logo, 4 titre, 5 espace, 6 en-tête du tableau

  // --- Feuille 1 : Détail par jour et par opératrice ---
  const s1 = workbook.addWorksheet('Détail par jour');
  s1.columns = [
    {key:'date', width:14},
    ...ops.map((name,i)=>({key:'op'+(i+1), width:13})),
    {key:'total', width:10},
    {key:'obj', width:10},
    {key:'rend', width:12},
    {key:'statut', width:12},
    {key:'editby', width:18},
  ];
  addBrandHeader(s1, `Détail par jour — Période du ${periodLabel}`, s1.columns.length);
  s1.addImage(logoImageId, { tl:{col:0,row:0}, ext:{width:150,height:42} });
  const h1 = s1.getRow(DATA_START_ROW);
  h1.values = ['Date', ...ops, 'Total', 'Objectif', 'Rendement', 'Statut', 'Modifié par'];
  h1.fill = headerFill; h1.font = headerFont;
  list.forEach(item => {
    s1.addRow({
      date: item.iso.split('-').reverse().join('/'),
      op1: item.totals.op1, op2: item.totals.op2, op3: item.totals.op3, op4: item.totals.op4,
      total: item.totals.totalGeneral,
      obj: Math.round(item.obj),
      rend: Math.round(item.rend)+'%',
      statut: item.day.status === 'validated' ? 'Validé' : 'Brouillon',
      editby: item.day.lastEditBy || '—'
    });
  });
  const totalRow = s1.addRow({
    date: 'TOTAL',
    op1: list.reduce((s,d)=>s+d.totals.op1,0),
    op2: list.reduce((s,d)=>s+d.totals.op2,0),
    op3: list.reduce((s,d)=>s+d.totals.op3,0),
    op4: list.reduce((s,d)=>s+d.totals.op4,0),
    total: list.reduce((s,d)=>s+d.totals.totalGeneral,0),
    obj: Math.round(list.reduce((s,d)=>s+d.obj,0)),
    rend:'', statut:'', editby:''
  });
  totalRow.font = {bold:true};
  totalRow.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFE9F1F9'}};

  // --- Feuille 2 : Classement des opératrices (+ graphique) ---
  const s2 = workbook.addWorksheet('Classement opératrices');
  s2.columns = [
    {key:'rank', width:14},
    {key:'nom', width:18},
    {key:'total', width:14},
    {key:'part', width:10},
  ];
  addBrandHeader(s2, `Classement des opératrices — Période du ${periodLabel}`, s2.columns.length);
  s2.addImage(logoImageId, { tl:{col:0,row:0}, ext:{width:150,height:42} });
  const h2 = s2.getRow(DATA_START_ROW);
  h2.values = ['Classement', 'Opératrice', 'Total pièces', 'Part'];
  h2.fill = headerFill; h2.font = headerFont;
  const perNameTotalsExport = {};
  list.forEach(d => {
    const opsForDay = getOpsForDate(d.iso);
    OP_KEYS.forEach((k,i) => {
      const name = opsForDay[i];
      if(name === '(poste vacant)') return;
      perNameTotalsExport[name] = (perNameTotalsExport[name]||0) + (d.totals[k]||0);
    });
  });
  const grandTotal = Object.values(perNameTotalsExport).reduce((s,v)=>s+v,0);
  const ranking = Object.entries(perNameTotalsExport).map(([name,total])=>({name,total})).sort((a,b)=>b.total-a.total);
  ranking.forEach((r,i) => {
    s2.addRow({ rank:i+1, nom:r.name, total:r.total, part: grandTotal>0 ? Math.round(r.total/grandTotal*100)+'%' : '0%' });
  });
  try{
    const rankChartImg = renderChartToImage(ranking.map(r=>r.name), ranking.map(r=>r.total), 'Classement des opératrices (total pièces)', '#0F3D66');
    const rankImgId = workbook.addImage({ base64: rankChartImg, extension: 'png' });
    const rankChartRow = DATA_START_ROW + ranking.length + 3;
    s2.addImage(rankImgId, { tl:{col:0,row:rankChartRow}, ext:{width:700,height:360} });
  }catch(err){ console.error('Erreur graphique classement :', err); }

  // --- Feuille 3 : Graphique de la production totale par jour ---
  try{
    const s3 = workbook.addWorksheet('Graphique production');
    addBrandHeader(s3, `Production totale par jour — Période du ${periodLabel}`, 10);
    s3.addImage(logoImageId, { tl:{col:0,row:0}, ext:{width:150,height:42} });
    const chartLabels = list.map(d => d.iso.split('-').reverse().slice(0,2).join('/'));
    const chartValues = list.map(d => d.totals.totalGeneral);
    const chartImg = renderChartToImage(chartLabels, chartValues, 'Production totale par jour', '#1F8F5F');
    const imageId = workbook.addImage({ base64: chartImg, extension: 'png' });
    s3.addImage(imageId, { tl: { col: 0, row: DATA_START_ROW }, ext: { width: 800, height: 420 } });
  }catch(err){
    console.error('Erreur génération graphique Excel :', err);
    // On continue sans le graphique plutôt que de bloquer tout l'export
  }

  try{
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `TEK-TREND_periode_${startISO}_au_${endISO}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    showToast("Fichier Excel téléchargé");
  }catch(err){
    console.error('Erreur génération fichier Excel :', err);
    showToast("Erreur lors de la génération du fichier Excel.");
  }
};

// --- EXPORT CSV ---
window.exportCSV = () => {
  const data = getDay(histDate); const totals = computeTotals(data); const ops = getOpsForDate(histDate); const obj = getObjForDay(data);
  const dayHours = getHoursForDate(histDate);
  let csv = `Horaires;${ops[0]};${ops[1]};${ops[2]};${ops[3]};Total Heure;Total Cumule;Observations\n`;
  let cumul = 0;
  dayHours.forEach(h => {
    const d = data.hours[h] || {op1:'',op2:'',op3:'',op4:'',obs:''};
    const rTot = OP_KEYS.reduce((sum, k) => sum + (parseInt(d[k])||0), 0);
    cumul += rTot;
    csv += `${h};${d.op1};${d.op2};${d.op3};${d.op4};${rTot};${cumul};"${d.obs}"\n`;
  });
  csv += `TOTAL JOUR;${totals.op1};${totals.op2};${totals.op3};${totals.op4};${totals.totalGeneral};-;Objectif Jour: ${obj}\n`;
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `TEK-TREND_${histDate}.csv`; a.click(); URL.revokeObjectURL(url);
  showToast("Fichier Excel Téléchargé");
};

window.onload = init;
