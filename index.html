function renderParams(container){
  let ops = getOps(); let rate = getObjHoraireOp(); let obj = getObj();
  let sch = getScheduleSettings();
  container.innerHTML = `
    <div class="flex-header"><h2>Paramètres de l'Atelier</h2></div>
    <div class="card">
      <h3 style="margin-top:0;">Cadence de Référence</h3>
      <div class="field">
        <label>Pièces / heure / opératrice</label>
        <input type="number" id="setting_rate" value="${rate}" style="font-weight:bold; font-size:18px;">
      </div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5;">
        Référence actuelle : <b>3 min/pièce</b> (soit ${rate} pièces/h et par opératrice).<br>
        Objectif théorique semaine type (Lun-Ven, ${OP_KEYS.length} opératrices) : <b>${obj} pièces/jour</b>.<br>
        <b>En cas d'absence</b> : tapez <code>ABS</code> (ou tout texte) dans la case d'une opératrice au lieu d'un chiffre — l'objectif de cette heure-là est automatiquement réduit en conséquence, sur le Tableau de bord, la Saisie et l'Historique.
      </div>
      
      <hr style="border:0; border-top:1px solid var(--border); margin:24px 0;">

      <h3>Horaires de Travail</h3>
      <p style="font-size:12px; color:var(--ink-soft); margin-bottom:15px;">Utilisés automatiquement pour calculer les créneaux et l'objectif de chaque jour.</p>

      <div style="font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-bottom:8px;">Lundi → Vendredi</div>
      <div class="kpi-grid" style="margin-bottom:14px;">
        <div class="field" style="margin:0;"><label>Début</label><input type="time" id="sch_wstart" value="${sch.weekdayStart}"></div>
        <div class="field" style="margin:0;"><label>Fin</label><input type="time" id="sch_wend" value="${sch.weekdayEnd}"></div>
        <div class="field" style="margin:0;"><label>Pause début</label><input type="time" id="sch_pstart" value="${sch.pauseStart}"></div>
        <div class="field" style="margin:0;"><label>Pause fin</label><input type="time" id="sch_pend" value="${sch.pauseEnd}"></div>
      </div>

      <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-bottom:8px;">
        <input type="checkbox" id="sch_sat_enabled" ${sch.saturdayEnabled?'checked':''} style="width:16px;height:16px;"> Samedi travaillé
      </div>
      <div class="kpi-grid">
        <div class="field" style="margin:0;"><label>Début</label><input type="time" id="sch_sstart" value="${sch.saturdayStart}"></div>
        <div class="field" style="margin:0;"><label>Fin</label><input type="time" id="sch_send" value="${sch.saturdayEnd}"></div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-faint);margin-top:8px;">Dimanche : toujours non travaillé.</div>
      
      <hr style="border:0; border-top:1px solid var(--border); margin:24px 0;">
      
      <h3>Noms des Opératrices</h3>
      <p style="font-size:12px; color:var(--ink-soft); margin-bottom:15px;">La modification s'applique instantanément partout, y compris dans l'historique.</p>
      
      <div class="kpi-grid">
        ${OP_KEYS.map((k, i) => `
          <div class="field">
            <label>Poste ${i+1}</label>
            <input type="text" id="setting_op${i}" value="${ops[i]}" style="font-weight:bold;">
          </div>
        `).join('')}
      </div>
      
      <button class="btn btn-primary btn-block" style="margin-top:15px;" onclick="saveParams()">Enregistrer les paramètres</button>
    </div>
  `;
  
  window.saveParams = () => {
    let v = parseInt(document.getElementById('setting_rate').value);
    if(!isNaN(v) && v > 0) setJSON('obj_horaire_op', v);

    const wstart = document.getElementById('sch_wstart').value;
    const wend = document.getElementById('sch_wend').value;
    const pstart = document.getElementById('sch_pstart').value;
    const pend = document.getElementById('sch_pend').value;
    const satEnabled = document.getElementById('sch_sat_enabled').checked;
    const sstart = document.getElementById('sch_sstart').value;
    const send = document.getElementById('sch_send').value;

    if(!wstart || !wend || wstart >= wend){ showToast("Horaires semaine invalides : l'heure de fin doit être après le début."); return; }
    if(pstart && pend && pstart >= pend){ showToast("Pause invalide : l'heure de fin doit être après le début."); return; }
    if(pstart && (pstart < wstart || pstart > wend)){ showToast("La pause doit être comprise dans les horaires de la journée."); return; }
    if(satEnabled && (!sstart || !send || sstart >= send)){ showToast("Horaires du samedi invalides."); return; }

    setJSON('schedule', {
      weekdayStart: wstart, weekdayEnd: wend, pauseStart: pstart||null, pauseEnd: pend||null,
      saturdayEnabled: satEnabled, saturdayStart: sstart, saturdayEnd: send
    });
    
    let newOps = [
      document.getElementById('setting_op0').value.trim() || "Opératrice 1",
      document.getElementById('setting_op1').value.trim() || "Opératrice 2",
      document.getElementById('setting_op2').value.trim() || "Opératrice 3",
      document.getElementById('setting_op3').value.trim() || "Opératrice 4"
    ];
    setJSON('ops', newOps);
    showToast("Paramètres appliqués avec succès !");
    nav('params');
  };
}

    nav('sessions');

function getMessages(){ return getJSON('messages', {}); }

// --- Badge "non lu" sur l'onglet Messages ---
function getLastSeenMessages(){
  try { return parseInt(window.localStorage.getItem(CACHE_PREFIX+'msg_seen_'+currentUser.username)) || 0; } catch(e){ return 0; }
}
function setLastSeenMessagesNow(){
  try { window.localStorage.setItem(CACHE_PREFIX+'msg_seen_'+currentUser.username, String(Date.now())); } catch(e) {}
}
function getUnreadMessageCount(){
  if(!currentUser) return 0;
  const msgs = getMessages();
  const lastSeen = getLastSeenMessages();
  return Object.values(msgs).filter(m => (m.at||0) > lastSeen && m.authorUsername !== currentUser.username).length;
}
function updateNavBadges(){
  const unread = getUnreadMessageCount();
  document.querySelectorAll('.nav-badge').forEach(el => el.remove());
  if(unread > 0){
    document.querySelectorAll('[data-tab="messages"] .nav-icon-wrap').forEach(wrap => {
      const dot = document.createElement('span');
      dot.className = 'nav-badge';
      wrap.appendChild(dot);
    });
  }
}

// --- Notifications système (tant que l'app reste ouverte, même en arrière-plan) ---
// IMPORTANT : ceci ne fonctionne QUE si l'application est encore chargée en
// mémoire (onglet ouvert, même non actif). Si l'application est complètement
// fermée, aucune notification ne peut arriver — cela nécessiterait un serveur
// d'envoi (Firebase Cloud Functions, payant), ce qui n'est pas mis en place ici.
let knownMessageIds = null;
function checkForNewMessages(allData){
  const msgs = (allData && allData.messages) || {};
  const ids = Object.keys(msgs);
  if(knownMessageIds === null){
    knownMessageIds = new Set(ids); // premier chargement : pas de notification rétroactive
    return;
  }
  ids.forEach(id => {
    if(!knownMessageIds.has(id)){
      knownMessageIds.add(id);
      const m = msgs[id];
      if(currentUser && m.authorUsername !== currentUser.username) notifyNewMessage(m);
    }
  });
}
function notifyNewMessage(m){
  updateNavBadges();
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const title = 'TEK-TREND — ' + (m.authorName || 'Nouveau message');
  const opts = { body: m.text, icon: './icon-192.png', tag: 'tek-trend-msg-'+Date.now() };
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){ reg.showNotification(title, opts); }).catch(function(){ new Notification(title, opts); });
    } else {
      new Notification(title, opts);
    }
  }catch(e){ console.error('Erreur notification :', e); }
}
window.requestNotifPermission = () => {
  if(typeof Notification === 'undefined'){ showToast("Les notifications ne sont pas prises en charge par ce navigateur."); return; }
  Notification.requestPermission().then(function(perm){
    if(perm === 'granted') showToast('Notifications activées !');
    else showToast('Notifications refusées — vous pouvez les activer plus tard dans les réglages du navigateur.');
    nav('messages');
  });
};

function timeAgoOrDate(ts){
  if(!ts) return '';
  const diff = Date.now() - ts;
  if(diff < 24*3600000) return timeAgo(ts);
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

    <div class="card">
      <p style="font-size:12px;color:var(--ink-soft);margin-top:0;">Visible par le Responsable, la Direction et le Chef de chaîne. Utilisez-le pour signaler un problème ou laisser une consigne.</p>

      <button class="btn btn-primary" onclick="sendMessage()">Envoyer</button>
    </div>
    <div class="card">
      ${list.length === 0 ? buildEmptyState("Aucun message pour l'instant", "Le premier message envoyé apparaîtra ici pour tout le monde.") : list.map(([id, m]) => `
        <div class="session-row" style="align-items:flex-start;">
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;">
              <b>${esc(m.authorName || m.authorUsername || 'Inconnu')}</b>
              <span class="badge ${roleBadgeClass(m.authorRole)}" style="font-size:9.5px;">${roleLabel(m.authorRole)}</span>

        </div>

  window.sendMessage = () => {
    const el = document.getElementById('msg-text');
    const text = el.value.trim();
    if(!text){ showToast('Écrivez un message avant d\'envoyer'); return; }
    const id = 'm' + Date.now() + Math.floor(Math.random()*1000);
    const all = getMessages();
    all[id] = { text, authorName: currentUser.nom, authorUsername: currentUser.username, authorRole: currentUser.role, at: Date.now() };
    setJSON('messages', all);
    el.value = '';
    showToast('Message envoyé');
    nav('messages');
  };

    if(!confirm('Supprimer ce message ?')) return;

    setJSON('messages', all);
    nav('messages');
  };
}

// --- EXPORT EXCEL DE LA PÉRIODE (multi-feuilles + graphique) ---
window.exportPeriodExcel = async () => {
  if(typeof ExcelJS === 'undefined'){
    showToast("Bibliothèque Excel indisponible — vérifiez votre connexion internet et réessayez.");
    return;
  }
  const startISO = histPeriodStart, endISO = histPeriodEnd;
  let curr = new Date(startISO+'T00:00:00'); let end = new Date(endISO+'T00:00:00');
  if(isNaN(curr.getTime()) || isNaN(end.getTime()) || curr > end){
    showToast("Période invalide : vérifiez les dates Du / Au.");
    return;
  }
  showToast("Génération du fichier Excel…");
  const periodLabel = startISO.split('-').reverse().join('/') + ' au ' + endISO.split('-').reverse().join('/');

  // Reconstitue la liste des jours réellement programmés sur la période
  let list = [];
  let g = 0;
  while(curr <= end && g < 93){
    let iso = toISODateLocal(curr);
    let d = getDay(iso); let t = computeTotals(d); let o = getObjForDay(d);
    if(o > 0) list.push({ iso, day: d, totals: t, obj: o, rend: o>0 ? (t.totalGeneral/o*100) : 0 });
    curr.setDate(curr.getDate()+1); g++;
  }
  if(list.length === 0){ showToast("Aucune donnée sur cette période."); return; }

  const ops = getOps();
  const workbook = new ExcelJS.Workbook();
  workbook.creator = 'TEK-TREND';
  workbook.created = new Date();

  const headerFill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF0F3D66'}};
  const headerFont = {bold:true, color:{argb:'FFFFFFFF'}};
  const logoImg = renderLogoImage();
  const logoImageId = workbook.addImage({ base64: logoImg, extension: 'png' });
  const DATA_START_ROW = 6; // ligne 1-3 logo, 4 titre, 5 espace, 6 en-tête du tableau

  // --- Feuille 1 : Détail par jour et par opératrice ---
  const s1 = workbook.addWorksheet('Détail par jour');
  s1.columns = [
    {key:'date', width:14},
    ...ops.map((name,i)=>({key:'op'+(i+1), width:13})),
    {key:'total', width:10},
    {key:'obj', width:10},
    {key:'rend', width:12},
    {key:'statut', width:12},
    {key:'editby', width:18},
  ];
  addBrandHeader(s1, `Détail par jour — Période du ${periodLabel}`, s1.columns.length);
  s1.addImage(logoImageId, { tl:{col:0,row:0}, ext:{width:150,height:42} });
  const h1 = s1.getRow(DATA_START_ROW);
  h1.values = ['Date', ...ops, 'Total', 'Objectif', 'Rendement', 'Statut', 'Modifié par'];
  h1.fill = headerFill; h1.font = headerFont;
  list.forEach(item => {
    s1.addRow({
      date: item.iso.split('-').reverse().join('/'),
      op1: item.totals.op1, op2: item.totals.op2, op3: item.totals.op3, op4: item.totals.op4,
      total: item.totals.totalGeneral,
      obj: Math.round(item.obj),
      rend: Math.round(item.rend)+'%',
      statut: item.day.status === 'validated' ? 'Validé' : 'Brouillon',
      editby: item.day.lastEditBy || '—'
    });
  });
  const totalRow = s1.addRow({
    date: 'TOTAL',
    op1: list.reduce((s,d)=>s+d.totals.op1,0),
    op2: list.reduce((s,d)=>s+d.totals.op2,0),
    op3: list.reduce((s,d)=>s+d.totals.op3,0),
    op4: list.reduce((s,d)=>s+d.totals.op4,0),
    total: list.reduce((s,d)=>s+d.totals.totalGeneral,0),
    obj: Math.round(list.reduce((s,d)=>s+d.obj,0)),
    rend:'', statut:'', editby:''
  });
  totalRow.font = {bold:true};
  totalRow.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFE9F1F9'}};

  // --- Feuille 2 : Classement des opératrices (+ graphique) ---
  const s2 = workbook.addWorksheet('Classement opératrices');
  s2.columns = [
    {key:'rank', width:14},
    {key:'nom', width:18},
    {key:'total', width:14},
    {key:'part', width:10},
  ];
  addBrandHeader(s2, `Classement des opératrices — Période du ${periodLabel}`, s2.columns.length);
  s2.addImage(logoImageId, { tl:{col:0,row:0}, ext:{width:150,height:42} });
  const h2 = s2.getRow(DATA_START_ROW);
  h2.values = ['Classement', 'Opératrice', 'Total pièces', 'Part'];
  h2.fill = headerFill; h2.font = headerFont;
  const perOpTotal = OP_KEYS.map(k => list.reduce((s,d)=>s+d.totals[k],0));
  const grandTotal = perOpTotal.reduce((s,v)=>s+v,0);
  const ranking = ops.map((name,i)=>({name, total: perOpTotal[i]})).sort((a,b)=>b.total-a.total);
  ranking.forEach((r,i) => {
    s2.addRow({ rank:i+1, nom:r.name, total:r.total, part: grandTotal>0 ? Math.round(r.total/grandTotal*100)+'%' : '0%' });
  });
  try{
    const rankChartImg = renderChartToImage(ranking.map(r=>r.name), ranking.map(r=>r.total), 'Classement des opératrices (total pièces)', '#0F3D66');
    const rankImgId = workbook.addImage({ base64: rankChartImg, extension: 'png' });
    const rankChartRow = DATA_START_ROW + ranking.length + 3;
    s2.addImage(rankImgId, { tl:{col:0,row:rankChartRow}, ext:{width:700,height:360} });
  }catch(err){ console.error('Erreur graphique classement :', err); }

  // --- Feuille 3 : Graphique de la production totale par jour ---
  try{
    const s3 = workbook.addWorksheet('Graphique production');
    addBrandHeader(s3, `Production totale par jour — Période du ${periodLabel}`, 10);
    s3.addImage(logoImageId, { tl:{col:0,row:0}, ext:{width:150,height:42} });
    const chartLabels = list.map(d => d.iso.split('-').reverse().slice(0,2).join('/'));
    const chartValues = list.map(d => d.totals.totalGeneral);
    const chartImg = renderChartToImage(chartLabels, chartValues, 'Production totale par jour', '#1F8F5F');
    const imageId = workbook.addImage({ base64: chartImg, extension: 'png' });
    s3.addImage(imageId, { tl: { col: 0, row: DATA_START_ROW }, ext: { width: 800, height: 420 } });
  }catch(err){
    console.error('Erreur génération graphique Excel :', err);
    // On continue sans le graphique plutôt que de bloquer tout l'export
  }

  try{
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `TEK-TREND_periode_${startISO}_au_${endISO}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    showToast("Fichier Excel téléchargé");
  }catch(err){
    console.error('Erreur génération fichier Excel :', err);
    showToast("Erreur lors de la génération du fichier Excel.");
  }
};

// --- EXPORT CSV ---
window.exportCSV = () => {
  const data = getDay(histDate); const totals = computeTotals(data); const ops = getOps(); const obj = getObjForDay(data);
  const dayHours = getHoursForDate(histDate);
  let csv = `Horaires;${ops[0]};${ops[1]};${ops[2]};${ops[3]};Total Heure;Total Cumule;Observations\n`;
  let cumul = 0;
  dayHours.forEach(h => {
    const d = data.hours[h] || {op1:'',op2:'',op3:'',op4:'',obs:''};
    const rTot = OP_KEYS.reduce((sum, k) => sum + (parseInt(d[k])||0), 0);
    cumul += rTot;
    csv += `${h};${d.op1};${d.op2};${d.op3};${d.op4};${rTot};${cumul};"${d.obs}"\n`;
  });
  csv += `TOTAL JOUR;${totals.op1};${totals.op2};${totals.op3};${totals.op4};${totals.totalGeneral};-;Objectif Jour: ${obj}\n`;
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `TEK-TREND_${histDate}.csv`; a.click(); URL.revokeObjectURL(url);
  showToast("Fichier Excel Téléchargé");
};

// Start
window.onload = init;
